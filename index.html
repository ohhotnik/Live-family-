
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIVE FAMILY</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#101b16;color:white;font-family:Arial}
canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}
.panel{position:fixed;z-index:3;background:#100d20ed;border:3px solid #9b75ff;border-radius:15px;padding:9px;box-shadow:0 0 8px #8d53ff}
#profile{top:8px;left:8px;font-size:14px;line-height:1.5}
#menu{top:150px;left:8px;display:grid;gap:5px;width:145px}
button{background:#382078;color:white;border:2px solid #ad8aff;border-radius:9px;padding:10px;font-weight:bold}
#chat{right:8px;top:180px;width:155px;height:210px}
#messages{height:125px;overflow:auto;font-size:12px}
#chat input{width:100%;padding:8px;margin-top:5px}
#mini{position:fixed;right:8px;top:8px;width:100px;height:90px;border:3px solid #9b75ff;border-radius:12px;background:#23482b;z-index:3}
#controls{position:fixed;bottom:15px;left:12px;z-index:4;display:grid;grid-template-columns:48px 48px 48px;gap:4px}
#actions{position:fixed;bottom:18px;right:12px;z-index:4;display:grid;gap:7px}
#notice{position:fixed;bottom:130px;left:50%;transform:translateX(-50%);z-index:4;background:#100d20ee;border:2px solid #9b75ff;padding:10px;border-radius:10px;font-size:13px}
#modal{display:none;position:fixed;inset:0;z-index:8;background:#000b;align-items:center;justify-content:center}
#modal div{background:#21143b;border:3px solid #a47aff;border-radius:14px;padding:20px;width:85%;max-width:320px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="profile" class="panel">
<b>👑 LIVE FAMILY</b><br>
👤 <span id="nick">Кайсар</span><br>
⭐ Уровень 1 · 0/100 XP<br>
💰 <span id="money">1000</span> ₽
</div>
<div id="menu" class="panel">
<button onclick="menu('Дом')">🏠 Дом</button>
<button onclick="menu('Магазин')">🛒 Магазин</button>
<button onclick="menu('Скин')">👕 Скин</button>
<button onclick="menu('Работа')">💼 Работа</button>
<button onclick="menu('Семья')">❤️ Семья</button>
<button onclick="menu('Инвентарь')">🎁 Инвентарь</button>
<button onclick="menu('Секреты')">⭐ Секреты</button>
<button onclick="menu('Карта')">📍 Карта</button>
</div>
<canvas id="mini" width="200" height="180"></canvas>
<div id="chat" class="panel">
<b>💬 Чат</b><div id="messages">Добро пожаловать!</div>
<input id="msg" placeholder="Сообщение">
<button onclick="send()">➤</button>
</div>
<div id="notice">Добро пожаловать в LIVE FAMILY!</div>
<div id="controls">
<span></span><button onpointerdown="move(0,-1)" onpointerup="stop()" onpointerleave="stop()">▲</button><span></span>
<button onpointerdown="move(-1,0)" onpointerup="stop()" onpointerleave="stop()">◀</button>
<button onpointerdown="move(0,1)" onpointerup="stop()" onpointerleave="stop()">▼</button>
<button onpointerdown="move(1,0)" onpointerup="stop()" onpointerleave="stop()">▶</button>
</div>
<div id="actions">
<button onclick="interact()">🚪 Действие</button>
<button onpointerdown="fast=true" onpointerup="fast=false" onpointerleave="fast=false">🏃 Бег</button>
</div>
<div id="modal"><div><h3 id="mt"></h3><section id="mc"></section><button onclick="closeModal()">Закрыть</button></div></div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const mini=document.getElementById('mini').getContext('2d');
let W,H;
function resize(){W=c.width=innerWidth;H=c.height=innerHeight}
onresize=resize;resize();

let nick=localStorage.getItem('lfnick')||prompt('Твой ник?')||'Кайсар';
localStorage.setItem('lfnick',nick);
document.getElementById('nick').textContent=nick;
let money=+(localStorage.getItem('lfmoney')||1000);
let player={x:0,y:0},cam={x:0,y:0};
let dx=0,dy=0,fast=false,inside=null;
let items=JSON.parse(localStorage.getItem('lfitems')||'[]');
const buildings=[
{x:-260,y:-180,w:160,h:110,name:'ДОМ',type:'home'},
{x:20,y:-210,w:170,h:120,name:'МАГАЗИН',type:'shop'},
{x:330,y:-175,w:170,h:120,name:'РАБОТА',type:'job'},
{x:-370,y:170,w:150,h:105,name:'ДОМ',type:'home'},
{x:330,y:190,w:150,h:105,name:'ДОМ',type:'home'}
];

function iso(x,y){
 return [W/2+(x-cam.x-y+cam.y)*.8,H/2+(x-cam.x+y-cam.y)*.4];
}
function poly(points,color){
 ctx.fillStyle=color;ctx.beginPath();
 points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));
 ctx.closePath();ctx.fill();
}
function rect(x,y,w,h,color){
 ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
}
function ground(){
 rect(0,0,W,H,'#286b38');
 // цельные парковые участки вместо повторяющихся ромбов
 for(let i=0;i<24;i++){
  let x=(i*197)%W,y=(i*131)%H;
  rect(x,y,65,35,'#328443');
  rect(x+8,y+8,4,4,'#e8b7d9');
 }
 // широкая улица и перекрёсток
 rect(0,H*.42,W,H*.20,'#9a9a9b');
 rect(W*.42,0,W*.17,H,'#9a9a9b');
 // тротуарные края
 rect(0,H*.415,W,7,'#d5c7ad');
 rect(0,H*.625,W,7,'#d5c7ad');
 rect(W*.415,0,7,H,'#d5c7ad');
 rect(W*.595,0,7,H,'#d5c7ad');
 // плитка
 for(let x=0;x<W;x+=45){
  rect(x,H*.47,2,H*.10,'#aaa9a5');
 }
}
function tree(x,y){
 let [sx,sy]=iso(x,y);
 // тень и ствол
 ctx.fillStyle='#25482b';ctx.beginPath();ctx.ellipse(sx,sy+13,25,10,0,0,7);ctx.fill();
 rect(sx-5,sy-22,10,30,'#75472b');
 // крона слоями
 ctx.fillStyle='#16723c';ctx.beginPath();ctx.arc(sx,sy-32,27,0,7);ctx.fill();
 ctx.fillStyle='#269b48';ctx.beginPath();ctx.arc(sx-9,sy-43,19,0,7);ctx.fill();
 ctx.fillStyle='#54b94d';ctx.beginPath();ctx.arc(sx+10,sy-48,14,0,7);ctx.fill();
}
function flower(x,y){
 let [sx,sy]=iso(x,y);
 for(let i=0;i<5;i++){
  ctx.fillStyle='#f4a6d7';ctx.beginPath();
  ctx.arc(sx+Math.cos(i*1.25)*5,sy+Math.sin(i*1.25)*5,3,0,7);ctx.fill();
 }
}
function building(b){
 let [x,y]=iso(b.x,b.y);
 let w=b.w*.8,h=b.h*.8;
 // тень
 ctx.fillStyle='#183b25';ctx.fillRect(x-w/2+9,y-h*.45+12,w,h*.8);
 // стены
 rect(x-w/2,y-h*.65,w,h*.8,b.type==='shop'?'#e6c4a1':b.type==='job'?'#9aa9c8':'#d7a77c');
 // крыша
 poly([[x-w/2-9,y-h*.65],[x,y-h*1.2],[x+w/2+9,y-h*.65],[x,y-h*.32]],
 b.type==='shop'?'#c84740':b.type==='job'?'#53658e':'#8c3935');
 // окна
 rect(x-w*.37,y-h*.53,w*.18,h*.25,'#68b9ec');
 rect(x+w*.19,y-h*.53,w*.18,h*.25,'#68b9ec');
 // дверь
 rect(x-11,y-24,22,42,'#603b2c');
 rect(x+5,y-5,3,3,'#e8d17a');
 // магазинный навес
 if(b.type==='shop'){
  rect(x-w*.49,y-h*.32,w*.98,13,'#f5e8e4');
  for(let i=0;i<6;i++)rect(x-w*.49+i*w*.164,y-h*.32,w*.082,13,'#d94c4b');
  rect(x-w*.30,y-h*.18,w*.60,30,'#4c8cdb');
 }
 // вывеска
 rect(x-w*.34,y-h*1.05,w*.68,23,'#25213c');
 ctx.fillStyle='white';ctx.font='bold 14px Arial';ctx.textAlign='center';
 ctx.fillText(b.name,x,y-h*.89);
}
function playerDraw(){
 let [x,y]=iso(player.x,player.y);
 // тень
 ctx.fillStyle='#25452b';ctx.beginPath();ctx.ellipse(x,y+7,14,6,0,0,7);ctx.fill();
 // ноги и тело
 rect(x-9,y-16,8,17,'#191c27');
 rect(x+2,y-16,8,17,'#191c27');
 rect(x-11,y-36,22,22,'#20202b');
 // голова
 rect(x-9,y-53,18,17,'#f0c29b');
 rect(x-11,y-58,22,8,'#201725');
 rect(x-8,y-42,4,3,'#24202a');
 rect(x+4,y-42,4,3,'#24202a');
 ctx.fillStyle='white';ctx.font='bold 13px Arial';ctx.textAlign='center';
 ctx.fillText(nick,x,y-67);
}
function park(){
 for(let x=-550;x<650;x+=170){
  tree(x,330);tree(x,-350);
  flower(x+45,270);flower(x-40,-300);
 }
 // скамейки
 for(let x of [-250,250]){
  let [sx,sy]=iso(x,300);
  rect(sx-24,sy-4,48,9,'#8a4d27');
  rect(sx-20,sy+5,5,12,'#60402b');
  rect(sx+15,sy+5,5,12,'#60402b');
 }
}
function interior(){
 rect(0,0,W,H,'#b28b65');
 rect(20,20,W-40,H-40,'#dfc49a');
 // плиточный пол
 for(let x=25;x<W-25;x+=48)rect(x,25,2,H-50,'#c6a87d');
 // мебель
 rect(45,100,100,65,'#885439');
 rect(W-145,100,100,65,'#885439');
 rect(W/2-35,H-130,70,100,'#77503a');
 ctx.fillStyle='#282033';ctx.font='bold 23px Arial';
 ctx.fillText(inside.name,35,55);
 ctx.font='14px Arial';ctx.fillStyle='#382c22';
 ctx.fillText('Нажми «Действие», чтобы выйти',35,80);
}
function drawMini(){
 mini.fillStyle='#24633a';mini.fillRect(0,0,200,180);
 mini.fillStyle='#aaa';mini.fillRect(0,78,200,25);mini.fillRect(87,0,25,180);
 mini.fillStyle='#d7a36c';
 buildings.forEach(b=>mini.fillRect(95+b.x/8,85+b.y/8,13,10));
 mini.fillStyle='white';mini.beginPath();
 mini.arc(100+player.x/8,90+player.y/8,5,0,7);mini.fill();
}
function loop(){
 ctx.clearRect(0,0,W,H);
 if(inside)interior();
 else{
  ground();park();
  buildings.forEach(building);
  playerDraw();
 }
 drawMini();
 requestAnimationFrame(loop);
}
loop();

function move(x,y){dx=x;dy=y}
function stop(){dx=dy=0}
function update(){
 if(!inside){
  let s=fast?5:2.5;
  player.x+=dx*s;player.y+=dy*s;
  cam.x+=(player.x-cam.x)*.10;
  cam.y+=(player.y-cam.y)*.10;
 }
 requestAnimationFrame(update);
}
update();

function interact(){
 if(inside){inside=null;notice('Вы вышли на улицу');return}
 let b=buildings.find(b=>Math.hypot(player.x-b.x,player.y-b.y)<125);
 if(!b){notice('Подойдите к двери');return}
 inside=b;notice('Вы вошли: '+b.name);
}
function notice(t){document.getElementById('notice').textContent=t}
function show(title,html){
 document.getElementById('mt').textContent=title;
 document.getElementById('mc').innerHTML=html;
 document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none'}
function menu(name){
 if(name==='Магазин'){
  show(name,'<p>Одежда — 100 ₽</p><button onclick="buy(100,\'Одежда\')">Купить</button><p>Шапка — 150 ₽</p><button onclick="buy(150,\'Шапка\')">Купить</button>');
 }else if(name==='Работа'){
  show(name,'<p>Выполни задание и получи 100 ₽</p><button onclick="earn()">Работать</button>');
 }else if(name==='Инвентарь'){
  show(name,items.length?items.map(x=>'<p>🎁 '+x+'</p>').join(''):'<p>Пока пусто</p>');
 }else if(name==='Секреты'){
  show(name,'<p>♡ Секретное сообщение ♡</p><p>Я тебя люблю, Вика!</p>');
 }else show(name,'<p>'+name+' — LIVE FAMILY</p><p>Исследуй город и знакомься с игроками!</p>');
}
function buy(price,item){
 if(money<price){notice('Недостаточно денег');return}
 money-=price;items.push(item);save();closeModal();notice('Куплено: '+item);
}
function earn(){money+=100;save();closeModal();notice('Ты заработал 100 ₽')}
function save(){
 localStorage.setItem('lfmoney',money);
 localStorage.setItem('lfitems',JSON.stringify(items));
 document.getElementById('money').textContent=money;
}
function send(){
 let v=document.getElementById('msg');
 if(!v.value.trim())return;
 let d=document.createElement('div');
 d.textContent=nick+': '+v.value;
 document.getElementById('messages').appendChild(d);
 v.value='';
}
onkeydown=e=>{
 let k=e.key.toLowerCase();
 if(k==='w'||k==='arrowup')move(0,-1);
 if(k==='s'||k==='arrowdown')move(0,1);
 if(k==='a'||k==='arrowleft')move(-1,0);
 if(k==='d'||k==='arrowright')move(1,0);
 if(k==='e')interact();
 if(k==='shift')fast=true;
};
onkeyup=e=>{
 let k=e.key.toLowerCase();
 if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k))stop();
 if(k==='shift')fast=false;
};
save();
</script>
</body>
</html>
