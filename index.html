
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIVE FAMILY</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#18251e;color:white;font-family:Arial}
canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}
.panel{position:fixed;z-index:5;background:#17251eeb;border:2px solid #83a96d;border-radius:9px;padding:9px;box-shadow:0 3px 0 #101a13}
#profile{top:8px;left:8px;font-size:13px}
#menu{top:105px;left:8px;display:grid;gap:5px}
button{background:#426b42;color:white;border:2px solid #a6ca86;border-radius:7px;padding:9px;font-weight:bold;cursor:pointer}
button:active{transform:scale(.94)}
#chat{right:8px;top:8px;width:185px;height:190px}
#messages{height:115px;overflow:auto;font-size:12px;overflow-wrap:anywhere}
#chat input{width:100%;margin-top:5px;padding:7px}
#notice{position:fixed;z-index:5;bottom:125px;left:50%;transform:translateX(-50%);background:#17251eeb;padding:10px;border:2px solid #83a96d;border-radius:8px;white-space:nowrap;font-size:13px}
#controls{position:fixed;bottom:12px;left:12px;z-index:6;display:grid;grid-template-columns:48px 48px 48px;gap:4px}
#actions{position:fixed;bottom:15px;right:12px;z-index:6;display:grid;gap:5px}
#modal{display:none;position:fixed;z-index:10;inset:0;background:#000b;align-items:center;justify-content:center}
#modalBox{background:#20382a;border:3px solid #a3c982;border-radius:12px;padding:20px;width:min(310px,90vw);text-align:center}
#modalBox button{margin:5px}
#minimap{position:fixed;right:205px;top:10px;width:75px;height:65px;background:#284e35;border:2px solid #a6ca86;border-radius:7px;z-index:4}
@media(max-width:600px){
 #chat{top:155px;width:145px;height:155px}
 #messages{height:80px}
 #minimap{right:8px;top:92px}
 #menu{top:105px}
 #notice{bottom:115px}
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="profile" class="panel">
<b>🏡 LIVE FAMILY</b><br>
👤 <span id="nickname">Кайсар</span><br>
⭐ Уровень 1<br>
💰 <span id="money">500</span> $
</div>

<div id="menu" class="panel">
<button onclick="openMenu('Карта города')">🗺 Карта</button>
<button onclick="openMenu('Магазин')">🛒 Магазин</button>
<button onclick="openMenu('Работа')">💼 Работа</button>
<button onclick="openMenu('Инвентарь')">🎒 Инвентарь</button>
<button onclick="openMenu('Семья')">❤️ Семья</button>
</div>

<canvas id="minimap" width="150" height="130"></canvas>

<div id="chat" class="panel">
<b>💬 Чат</b>
<div id="messages">Добро пожаловать в LIVE FAMILY!</div>
<input id="message" placeholder="Сообщение">
<button onclick="sendMessage()">➤</button>
</div>

<div id="notice">Добро пожаловать в город!</div>

<div id="controls">
<span></span><button onpointerdown="startMove(0,-1)" onpointerup="stopMove()" onpointerleave="stopMove()">▲</button><span></span>
<button onpointerdown="startMove(-1,0)" onpointerup="stopMove()" onpointerleave="stopMove()">◀</button>
<button onpointerdown="startMove(0,1)" onpointerup="stopMove()" onpointerleave="stopMove()">▼</button>
<button onpointerdown="startMove(1,0)" onpointerup="stopMove()" onpointerleave="stopMove()">▶</button>
</div>

<div id="actions">
<button onclick="interact()">🚪 Действие</button>
<button onpointerdown="running=true" onpointerup="running=false" onpointerleave="running=false">🏃 Бег</button>
</div>

<div id="modal">
<div id="modalBox">
<h3 id="modalTitle">LIVE FAMILY</h3>
<div id="modalContent"></div>
<button onclick="closeModal()">Закрыть</button>
</div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const mini=document.getElementById('minimap').getContext('2d');

let W,H,scale=1;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
 scale=Math.min(W/900,H/600);
}
addEventListener('resize',resize);resize();

let nickname=localStorage.getItem('lf_nick')||prompt('Твой игровой ник?')||'Кайсар';
localStorage.setItem('lf_nick',nickname);
document.getElementById('nickname').textContent=nickname;

let money=Number(localStorage.getItem('lf_money'))||500;
let player={x:0,y:0};
let camera={x:0,y:0};
let movement={x:0,y:0};
let running=false;
let inside=null;
let inventory=[];
let tick=0;

function save(){
 localStorage.setItem('lf_money',money);
 localStorage.setItem('lf_inventory',JSON.stringify(inventory));
}
try{inventory=JSON.parse(localStorage.getItem('lf_inventory'))||[]}catch(e){}

const buildings=[
 {x:-280,y:-180,name:'Мой дом',type:'house',color:'#d99b62'},
 {x:80,y:-210,name:'Магазин',type:'shop',color:'#e4b65d'},
 {x:390,y:-160,name:'Работа',type:'job',color:'#82a8c1'},
 {x:-350,y:190,name:'Дом',type:'house',color:'#c77e68'},
 {x:320,y:230,name:'Дом',type:'house',color:'#a78bc4'}
];

function iso(x,y){
 return {
  x:W/2+(x-camera.x-y+camera.y)*scale,
  y:H/2+(x-camera.x+y-camera.y)*.5*scale
 };
}
function polygon(points,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
 ctx.closePath();ctx.fill();
}
function diamond(x,y,w,h,color){
 polygon([[x,y-h/2],[x+w/2,y],[x,y+h/2],[x-w/2,y]],color);
}
function worldDiamond(x,y,w,h,color){
 const p=iso(x,y);
 diamond(p.x,p.y,w*scale,h*scale,color);
}
function box(x,y,w,h,color){
 const p=iso(x,y);
 ctx.fillStyle=color;
 ctx.fillRect(p.x-w*scale/2,p.y-h*scale,w*scale,h*scale);
}
function tree(x,y){
 worldDiamond(x,y,50,27,'#387a3c');
 worldDiamond(x,y-17,42,25,'#4b9a48');
 worldDiamond(x,y-33,32,21,'#5caf50');
 box(x,y+8,8,22,'#80502d');
}
function drawHouse(b){
 const p=iso(b.x,b.y);
 const s=scale;
 // тень
 diamond(p.x,p.y+12*s,150*s,75*s,'#426b43');
 // стены
 polygon([
 [p.x-55*s,p.y-35*s],[p.x,p.y-5*s],
 [p.x+55*s,p.y-35*s],[p.x+55*s,p.y+35*s],
 [p.x,p.y+65*s],[p.x-55*s,p.y+35*s]
 ],b.color);
 // крыша
 polygon([
 [p.x-60*s,p.y-35*s],[p.x,p.y-75*s],
 [p.x+60*s,p.y-35*s],[p.x,p.y+3*s]
 ],'#874638');
 polygon([
 [p.x-60*s,p.y-35*s],[p.x,p.y+3*s],
 [p.x,p.y-12*s],[p.x-60*s,p.y-52*s]
 ],'#a65342');
 // окна
 diamond(p.x-30*s,p.y+1*s,20*s,14*s,'#a8e4e7');
 diamond(p.x+27*s,p.y+1*s,20*s,14*s,'#a8e4e7');
 // дверь
 polygon([
 [p.x-9*s,p.y+18*s],[p.x,p.y+13*s],
 [p.x+10*s,p.y+18*s],[p.x+10*s,p.y+52*s],
 [p.x,p.y+57*s],[p.x-9*s,p.y+52*s]
 ],'#65402b');
 // вывеска
 ctx.fillStyle='white';
 ctx.font=`bold ${Math.max(10,12*s)}px Arial`;
 ctx.textAlign='center';
 ctx.fillText(b.name,p.x,p.y-82*s);
}
function drawPlayer(){
 const p=iso(player.x,player.y);
 const s=scale;
 // тень
 diamond(p.x,p.y+6*s,27*s,13*s,'#315b34');
 // ноги
 box(player.x-6,player.y,7,13,'#283b83');
 box(player.x+6,player.y,7,13,'#283b83');
 // тело
 box(player.x,player.y-15,19,22,'#315bd3');
 // голова
 box(player.x,player.y-37,16,16,'#edc39a');
 box(player.x,player.y-45,17,7,'#493022');
 const screen=iso(player.x,player.y);
 ctx.fillStyle='white';
 ctx.font=`bold ${Math.max(10,12*s)}px Arial`;
 ctx.textAlign='center';
 ctx.fillText(nickname,screen.x,screen.y-55*s);
}
function drawGrass(){
 for(let x=-1000;x<1000;x+=75){
  for(let y=-800;y<800;y+=75){
   const p=iso(x,y);
   diamond(p.x,p.y,70*scale,36*scale,'#69ad58');
   if((x+y)%225===0){
    ctx.fillStyle='#e9d46a';
    ctx.fillRect(p.x,p.y,3*scale,3*scale);
   }
  }
 }
}
function drawRoad(){
 for(let x=-1100;x<1100;x+=70){
  worldDiamond(x,0,75,48,'#b8aa8d');
  worldDiamond(0,x,75,48,'#b8aa8d');
 }
}
function drawInterior(){
 rect(0,0,W,H,'#b99a73');
 rect(20,20,W-40,H-40,'#d8bb8e');
 // пол
 for(let x=40;x<W-40;x+=50){
  ctx.fillStyle='#c9a87c';ctx.fillRect(x,40,2,H-80);
 }
 rect(50,90,110,65,'#8a5539');
 rect(W-170,90,110,65,'#8a5539');
 rect(W/2-55,H-120,110,120,'#815037');
 ctx.fillStyle='#fff';ctx.font='bold 22px Arial';
 ctx.fillText(inside.name,40,55);
 ctx.font='14px Arial';
 ctx.fillText('Выйдите через дверь внизу',40,80);
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function render(){
 tick++;
 ctx.clearRect(0,0,W,H);
 if(inside){drawInterior()}
 else{
  drawGrass();
  drawRoad();
  for(let x=-900;x<=900;x+=220)tree(x,340);
  for(let x=-900;x<=900;x+=220)tree(x,-370);
  buildings.forEach(drawHouse);
  drawPlayer();
 }
 // мини карта
 mini.fillStyle='#285333';mini.fillRect(0,0,150,130);
 mini.fillStyle='#b9aa8d';mini.fillRect(70,0,10,130);mini.fillRect(0,60,150,10);
 mini.fillStyle='#d4b06b';
 buildings.forEach(b=>mini.fillRect(75+(b.x/18),65+(b.y/18),9,8));
 mini.fillStyle='#fff';mini.fillRect(72+(player.x/18),62+(player.y/18),6,6);
 requestAnimationFrame(render);
}
render();

function startMove(x,y){movement={x,y}}
function stopMove(){movement={x:0,y:0}}
function update(){
 if(!inside){
  const speed=running?5:2.6;
  player.x+=movement.x*speed;
  player.y+=movement.y*speed;
  camera.x+=(player.x-camera.x)*.09;
  camera.y+=(player.y-camera.y)*.09;
 }
 requestAnimationFrame(update);
}
update();

function interact(){
 if(inside){
  inside=null;
  notice('Вы вышли на улицу');
  return;
 }
 const b=buildings.find(b=>Math.hypot(player.x-b.x,player.y-b.y)<115);
 if(!b){notice('Подойдите к двери здания');return}
 inside=b;
 notice('Вы вошли: '+b.name);
}
function notice(t){document.getElementById('notice').textContent=t}
function openModal(title,html){
 document.getElementById('modalTitle').textContent=title;
 document.getElementById('modalContent').innerHTML=html;
 document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none'}
function openMenu(name){
 if(name==='Магазин'){
  openModal('🛒 Магазин',
  `<p>Одежда — 100 $</p><button onclick="buy('Одежда',100)">Купить</button>
   <p>Шапка — 150 $</p><button onclick="buy('Шапка',150)">Купить</button>
   <p>Красивая одежда — 250 $</p><button onclick="buy('Красивая одежда',250)">Купить</button>`);
 }else if(name==='Работа'){
  openModal('💼 Работа',
  `<p>Работа курьером</p><p>Награда: 100 $</p><button onclick="work()">Выполнить задание</button>`);
 }else if(name==='Инвентарь'){
  openModal('🎒 Инвентарь',inventory.length?inventory.map(i=>'<p>🎁 '+i+'</p>').join(''):'<p>Пока пусто</p>');
 }else if(name==='Семья'){
  openModal('❤️ Семья','<p>Семейные функции скоро появятся.</p>');
 }else{
  openModal('🗺 Карта','<p>Центральный район LIVE FAMILY</p><p>Дома · Магазин · Работа</p>');
 }
}
function buy(item,cost){
 if(money<cost){notice('Недостаточно денег');return}
 money-=cost;inventory.push(item);save();updateMoney();
 notice('Куплено: '+item);closeModal();
}
function work(){
 money+=100;save();updateMoney();closeModal();
 notice('Вы заработали 100 $');
}
function updateMoney(){
 document.getElementById('money').textContent=money;
}
updateMoney();

function sendMessage(){
 const input=document.getElementById('message');
 if(!input.value.trim())return;
 const div=document.createElement('div');
 div.textContent=nickname+': '+input.value;
 document.getElementById('messages').appendChild(div);
 input.value='';
}
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(k==='w'||k==='arrowup')movement.y=-1;
 if(k==='s'||k==='arrowdown')movement.y=1;
 if(k==='a'||k==='arrowleft')movement.x=-1;
 if(k==='d'||k==='arrowright')movement.x=1;
 if(k==='e')interact();
 if(k==='shift')running=true;
});
addEventListener('keyup',e=>{
 const k=e.key.toLowerCase();
 if(['w','s','a','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k))stopMove();
 if(k==='shift')running=false;
});
</script>
</body>
</html>
.
