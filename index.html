
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIVE FAMILY 2D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#171729;color:white;font-family:Arial;overflow:hidden}
button,input,select{border:0;border-radius:10px;padding:10px;font-size:14px}
button{background:#8955e9;color:white;font-weight:bold}
button:active{transform:scale(.95)}
#creator{position:absolute;inset:0;z-index:10;background:#171329;display:flex;align-items:center;justify-content:center;padding:15px}
.panel{background:#28213f;border-radius:18px;padding:18px;width:min(420px,100%);max-height:95vh;overflow:auto}
.panel h1{text-align:center;color:#c6a3ff}
.panel input,.panel select{display:block;width:100%;margin:7px 0;background:#413957;color:white}
#game{display:none}
canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}
#top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:5px}
.info{background:#171729dd;padding:9px;border-radius:10px;font-size:12px}
#buttons{position:absolute;top:55px;right:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
#buttons button{font-size:11px;padding:9px 5px}
#stick{position:absolute;bottom:22px;left:18px;width:112px;height:112px;border-radius:50%;background:#ffffff25;border:2px solid #ffffff55;touch-action:none}
#knob{position:absolute;width:44px;height:44px;border-radius:50%;background:#c7a6ff;left:32px;top:32px}
#action{position:absolute;bottom:43px;right:20px;width:78px;height:78px;border-radius:50%;background:#a855f7}
#chat{position:absolute;bottom:145px;left:8px;width:185px;background:#171729dd;padding:8px;border-radius:10px;font-size:11px}
#chat input{width:100%;margin-top:5px;padding:7px;background:#403853;color:white}
#modal{display:none;position:absolute;inset:0;background:#0009;z-index:8;align-items:center;justify-content:center;padding:12px}
#modal .panel{max-width:380px}
#toast{display:none;position:absolute;top:48px;left:50%;transform:translateX(-50%);background:#34264f;padding:10px;border-radius:10px;z-index:9}
</style>
</head>
<body>

<div id="creator">
<div class="panel">
<h1>💜 LIVE FAMILY 2D</h1>
<p style="text-align:center">Создай своего персонажа</p>
<label>Имя</label>
<input id="name" maxlength="16" placeholder="Твоё имя">
<label>Пол</label>
<select id="gender"><option>Мужской</option><option>Женский</option></select>
<label>Профессия</label>
<select id="job">
<option>Житель</option><option>Полицейский</option>
<option>Врач</option><option>Повар</option>
<option>Таксист</option><option>Строитель</option>
<option>Бизнесмен</option><option>Блогер</option>
<option>Спасатель</option><option>Учитель</option>
</select>
<label>Цвет кожи</label>
<select id="skin">
<option value="#f1c6a5">Светлый</option>
<option value="#bd805b">Смуглый</option>
<option value="#75452f">Тёмный</option>
</select>
<label>Одежда</label>
<select id="clothes">
<option value="#9855ee">Фиолетовая</option>
<option value="#267bea">Синяя</option>
<option value="#df4e5b">Красная</option>
<option value="#239c65">Зелёная</option>
<option value="#e69b32">Оранжевая</option>
</select>
<button style="width:100%;margin-top:12px" onclick="startGame()">▶ НАЧАТЬ ИГРУ</button>
</div>
</div>

<div id="game">
<canvas id="world"></canvas>
<div id="top">
<div class="info" id="playerInfo">Игрок</div>
<div class="info" id="money">💰 1000</div>
</div>
<div id="buttons">
<button onclick="interact('Привет!')">👋 Привет</button>
<button onclick="interact('Ты танцуешь!')">💃 Танец</button>
<button onclick="interact('Ты дома!')">🏠 Дом</button>
<button onclick="work()">💼 Работа</button>
<button onclick="interact('Ты сел в машину!')">🚗 Машина</button>
<button onclick="showCommands()">⌨ Команды</button>
<button onclick="changeClothes()">👕 Одежда</button>
<button onclick="showMap()">🗺 Карта</button>
<button onclick="showFamily()">👨‍👩‍👧 Семья</button>
<button onclick="showBots()">🤖 Боты</button>
</div>
<div id="chat">
<div id="messages">Добро пожаловать в город!</div>
<input id="chatInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter')sendChat()">
</div>
<div id="stick"><div id="knob"></div></div>
<button id="action" onclick="nearAction()">ДЕЙСТВИЕ</button>
<div id="toast"></div>
</div>

<div id="modal">
<div class="panel">
<h2 id="modalTitle">Меню</h2>
<div id="modalContent"></div>
<button style="width:100%;margin-top:12px" onclick="closeModal()">Закрыть</button>
</div>
</div>

<script>
const canvas=document.getElementById('world');
const ctx=canvas.getContext('2d');
let W=0,H=0;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener('resize',resize);

let player={x:500,y:500,name:'Игрок',job:'Житель',skin:'#f1c6a5',clothes:'#9855ee',money:1000};
let bots=[],cars=[],trees=[],keys={};
let joy={x:0,y:0},camera={x:0,y:0};
let started=false,chatMessages=[];
const buildings=[
{x:150,y:130,w:190,h:140,c:'#d6a36c',name:'ДОМ'},
{x:480,y:100,w:200,h:150,c:'#8daecb',name:'МАГАЗИН'},
{x:850,y:160,w:200,h:160,c:'#b6a1d0',name:'ДОМ'},
{x:150,y:650,w:220,h:155,c:'#c38b72',name:'БОЛЬНИЦА'},
{x:610,y:650,w:230,h:160,c:'#8c9ea9',name:'ШКОЛА'},
{x:1050,y:650,w:190,h:140,c:'#d3ad6e',name:'КАФЕ'}
];

function startGame(){
player.name=document.getElementById('name').value.trim()||'Игрок';
player.job=document.getElementById('job').value;
player.skin=document.getElementById('skin').value;
player.clothes=document.getElementById('clothes').value;
document.getElementById('creator').style.display='none';
document.getElementById('game').style.display='block';
document.getElementById('playerInfo').textContent='👤 '+player.name+' · '+player.job;
makeBots();makeCars();makeTrees();started=true;loop();
}

function makeBots(){
let names=['Вика','Максим','Аня','Дима','Саша','Маша','Илья','София','Артём','Катя','Даня','Лиза'];
let jobs=['Житель','Полицейский','Врач','Повар','Таксист','Учитель'];
for(let i=0;i<names.length;i++){
bots.push({
name:names[i],job:jobs[i%jobs.length],
x:250+Math.random()*900,y:250+Math.random()*700,
skin=['#f1c6a5','#bd805b','#75452f'][i%3],
color=['#ef6585','#45b6a5','#e5a43c','#678ce8'][i%4],
dx:Math.random()*2-1,dy:Math.random()*2-1,t:0
});
}
}
function makeCars(){
for(let i=0;i<7;i++)cars.push({x:350+i*120,y:460+(i%2)*45,c:['#df5050','#3885d8','#e6bb42','#eeeeee'][i%4]});
}
function makeTrees(){
for(let i=0;i<65;i++)trees.push({x:Math.random()*1600,y:Math.random()*1300});
}
function rect(x,y,w,h,c){
ctx.fillStyle=c;ctx.fillRect(x-camera.x,y-camera.y,w,h);
}
function drawWorld(){
ctx.fillStyle='#78a96b';ctx.fillRect(0,0,W,H);
rect(0,420,1600,180,'#777b83');
rect(720,0,150,1300,'#777b83');
for(let x=0;x<1600;x+=65)rect(x,507,35,5,'#e8d58a');
for(let y=0;y<1300;y+=65)rect(790,y,5,35,'#e8d58a');

for(let t of trees){
rect(t.x-15,t.y-18,52,42,'#26734a');
rect(t.x-7,t.y-28,36,28,'#39945b');
rect(t.x,t.y+20,12,20,'#70452e');
}
for(let b of buildings){
rect(b.x+7,b.y+9,b.w,b.h,'#46534c');
rect(b.x,b.y,b.w,b.h,b.c);
rect(b.x+12,b.y+12,b.w-24,22,'#eeeae0');
for(let wx=b.x+25;wx<b.x+b.w-25;wx+=55){
rect(wx,b.y+52,28,35,'#9ed6e8');
rect(wx,b.y+105,28,25,'#9ed6e8');
}
rect(b.x+b.w/2-18,b.y+b.h-45,36,45,'#654637');
ctx.fillStyle='white';ctx.font='bold 13px Arial';
ctx.fillText(b.name,b.x-camera.x+10,b.y-camera.y-8);
}
for(let c of cars){
rect(c.x,c.y,65,30,c.c);
rect(c.x+10,c.y-9,38,13,'#a9dbe9');
rect(c.x+8,c.y+25,12,10,'#25252b');
rect(c.x+48,c.y+25,12,10,'#25252b');
}
}
function drawPerson(p,isPlayer=false){
let x=p.x-camera.x,y=p.y-camera.y;
rect(x-9,y-15,18,23,isPlayer?p.clothes:p.color);
ctx.fillStyle=p.skin||'#efc29d';
ctx.fillRect(x-8,y-29,16,15);
ctx.fillStyle='#29212a';
ctx.fillRect(x-8,y-32,16,5);
ctx.fillStyle='white';ctx.font='11px Arial';ctx.textAlign='center';
ctx.fillText(p.name,x,y-38);
if(!isPlayer){
ctx.font='9px Arial';ctx.fillText(p.job,x,y-47);
}
ctx.textAlign='left';
}
function updateBots(){
for(let b of bots){
b.t++;
if(b.t>70){
b.dx=Math.random()*2-1;b.dy=Math.random()*2-1;b.t=0;
}
b.x+=b.dx*.7;b.y+=b.dy*.7;
b.x=Math.max(20,Math.min(1550,b.x));
b.y=Math.max(20,Math.min(1250,b.y));
}
}
function loop(){
if(!started)return;
let dx=joy.x+(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0);
let dy=joy.y+(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
let len=Math.hypot(dx,dy)||1;
player.x=Math.max(20,Math.min(1550,player.x+dx/len*3.2));
player.y=Math.max(20,Math.min(1250,player.y+dy/len*3.2));
updateBots();
camera.x=Math.max(0,Math.min(1600-W,player.x-W/2));
camera.y=Math.max(0,Math.min(1300-H,player.y-H/2));
drawWorld();
for(let b of bots)drawPerson(b);
drawPerson(player,true);
requestAnimationFrame(loop);
}

const stick=document.getElementById('stick');
const knob=document.getElementById('knob');
let pointer=null;
function moveStick(e){
let r=stick.getBoundingClientRect();
let x=e.clientX-r.left-56,y=e.clientY-r.top-56;
let len=Math.hypot(x,y),max=35;
if(len>max){x=x/len*max;y=y/len*max}
joy.x=x/max;joy.y=y/max;
knob.style.left=(32+x)+'px';knob.style.top=(32+y)+'px';
}
stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e)});
stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)moveStick(e)});
function resetStick(){pointer=null;joy.x=0;joy.y=0;knob.style.left='32px';knob.style.top='32px'}
stick.addEventListener('pointerup',resetStick);
stick.addEventListener('pointercancel',resetStick);
addEventListener('keydown',e=>{keys[e.key]=true});
addEventListener('keyup',e=>{keys[e.key]=false});

function toast(s){
let t=document.getElementById('toast');
t.textContent=s;t.style.display='block';
clearTimeout(toast.timer);
toast.timer=setTimeout(()=>t.style.display='none',2200);
}
function say(s){
document.getElementById('messages').textContent=s;
toast(s);
}
function interact(s){say(s)}
function work(){
player.money+=100;
document.getElementById('money').textContent='💰 '+player.money;
say('Ты поработал! Получено 100 монет.');
}
function nearAction(){
let b=bots.find(b=>Math.hypot(b.x-player.x,b.y-player.y)<90);
if(b)say(b.name+': Привет! Как дела?');
else say('Ты осматриваешь город.');
}
function sendChat(){
let input=document.getElementById('chatInput');
let v=input.value.trim();if(!v)return;
say(player.name+': '+v);input.value='';
}
function openModal(title,html){
document.getElementById('modalTitle').textContent=title;
document.getElementById('modalContent').innerHTML=html;
document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none'}
function showCommands(){
openModal('⌨ Команды',`
<p>/help — список команд</p>
<p>/money — показать деньги</p>
<p>/job — работа</p>
<p>/home — домой</p>
<p>/dance — танцевать</p>
<p>/hello — привет</p>
<p>/bots — жители города</p>
<p>/family — семья</p>
<p>/car — транспорт</p>
<input id="cmdInput" placeholder="Введи команду">
<button onclick="runCommand()">Выполнить</button>`);
}
function runCommand(){
let c=document.getElementById('cmdInput').value.toLowerCase().trim();
closeModal();
if(c==='/help')showCommands();
else if(c==='/money')say('Твои деньги: '+player.money);
else if(c==='/job')work();
else if(c==='/home')say('Ты пришёл домой.');
else if(c==='/dance')say('Ты танцуешь!');
else if(c==='/hello')say('Ты поздоровался с жителями.');
else if(c==='/bots')showBots();
else if(c==='/family')showFamily();
else if(c==='/car')say('Ты сел в машину.');
else say('Неизвестная команда. Напиши /help');
}
function showBots(){
let list=bots.map(b=>'<p>🤖 '+b.name+' — '+b.job+'</p>').join('');
openModal('Жители города',list);
}
function showFamily(){
openModal('👨‍👩‍👧 Семья',
'<p>Добро пожаловать в семейную жизнь!</p><p>Здесь можно общаться с жителями, обустраивать дом и заботиться о семье.</p><button onclick="say(\'Ты проводишь время с семьёй!\');closeModal()">Провести время вместе</button>');
}
function showMap(){
openModal('🗺 Карта города',
'<p>🏠 Дома</p><p>🏥 Больница</p><p>🏫 Школа</p><p>🛒 Магазин</p><p>☕ Кафе</p><p>🚗 Парковка</p>');
}
function changeClothes(){
let colors=['#9855ee','#267bea','#df4e5b','#239c65','#e69b32','#eeeeee'];
let i=colors.indexOf(player.clothes);
player.clothes=colors[(i+1)%colors.length];
say('Ты сменил одежду!');
}
</script>
</body>
</html>
