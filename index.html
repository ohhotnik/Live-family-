
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIVE FAMILY 2D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090817;color:white;font-family:Arial;overflow:hidden;touch-action:none}
#game{width:100vw;height:100dvh;display:block;image-rendering:pixelated}
button{color:white;background:#351078;border:2px solid #a65bff;border-radius:13px;padding:10px;font-weight:bold;font-size:14px}
button:active{background:#8a38ee;transform:scale(.96)}
#profile{position:absolute;top:9px;left:8px;background:#100b25eF;border:2px solid #a45cff;border-radius:15px;padding:9px;font-size:13px}
#money{position:absolute;right:10px;top:12px;background:#100b25;border:2px solid #a45cff;border-radius:12px;padding:12px}
#menu{position:absolute;right:8px;top:65px;width:142px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
#menu button{font-size:12px;padding:11px 3px}
#panel{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,370px);max-height:75%;overflow:auto;background:#100a26;border:3px solid #b05aff;border-radius:18px;padding:15px;box-shadow:0 0 22px #9c38ff}
#panel h2{margin:5px;color:#e4aaff}
#panel button{margin:4px}
#close{float:right}
#chat{position:absolute;bottom:105px;left:8px;width:min(48%,310px);background:#100b25df;border:1px solid #9f52f9;border-radius:14px;padding:9px}
#messages{height:45px;overflow:auto;font-size:12px}
#message{width:100%;background:#281c43;color:white;border:0;border-radius:10px;padding:10px}
#controls{position:absolute;bottom:15px;left:12px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:3px}
#controls button{font-size:22px;padding:0;background:#17102e;border-color:#b28bff}
#up{grid-column:2}
#left{grid-column:1;grid-row:2}
#down{grid-column:2;grid-row:2}
#right{grid-column:3;grid-row:2}
#actions{position:absolute;right:12px;bottom:22px;display:flex;flex-direction:column;gap:9px}
#actions button{border-radius:50%;width:76px;height:76px;background:#982cff;border:3px solid #d4a5ff}
#hint{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:#150c28dc;padding:10px;border-radius:12px;display:none}
@media(min-width:700px){
#menu{width:240px}
#menu button{font-size:15px}
#actions{flex-direction:row}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="profile">
 👑 LIVE FAMILY<br>
 <b id="playerName">Кайсар</b> ♡<br>
 Уровень: <span id="level">1</span><br>
 XP: <span id="xp">0</span>/100
</div>

<div id="money">🪙 <span id="cash">1000</span> ₽</div>

<div id="menu">
<button onclick="openMenu('🏠 Дом')">🏠 Дом</button>
<button onclick="openMenu('🛒 Магазин')">🛒 Магазин</button>
<button onclick="openMenu('👕 Одежда')">👕 Одежда</button>
<button onclick="openMenu('💼 Работа')">💼 Работа</button>
<button onclick="openMenu('❤️ Семья')">❤️ Семья</button>
<button onclick="openMenu('🎒 Инвентарь')">🎒 Инвентарь</button>
<button onclick="openMenu('⭐ Секреты')">⭐ Секреты</button>
<button onclick="openMenu('🗺 Карта')">🗺 Карта</button>
</div>

<div id="chat">
<div id="messages">Добро пожаловать в LIVE FAMILY! 💜</div>
<input id="message" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter')sendMessage()">
</div>

<div id="controls">
<button id="up">▲</button>
<button id="left">◀</button>
<button id="down">▼</button>
<button id="right">▶</button>
</div>

<div id="actions">
<button onclick="action('Бег')">🏃<br>Бег</button>
<button onclick="action('Прыжок')">⬆️<br>Прыжок</button>
<button onclick="action('Сон')">🛏<br>Сон</button>
</div>

<div id="panel">
<button id="close" onclick="closeMenu()">✖</button>
<h2 id="panelTitle">Меню</h2>
<div id="panelContent"></div>
</div>

<div id="hint"></div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=960,H=540;
let money=1000,xp=0,level=1;
let inside=false;
let currentRoom="Дом";
let gameTime=0;

const player={
 x:480,y:350,
 speed:2.5,
 color:"#18152c",
 clothes:"#25223b",
 moving:false,
 direction:1
};

let camera={x:0,y:0};
let keys={};
let buildings=[];
let trees=[];
let cars=[];
let npcs=[];

function resize(){
 canvas.width=innerWidth*devicePixelRatio;
 canvas.height=innerHeight*devicePixelRatio;
 W=canvas.width;
 H=canvas.height;
}
addEventListener("resize",resize);
resize();

function rectangle(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function text(t,x,y,size=16,color="white"){
 ctx.fillStyle=color;
 ctx.font="bold "+size+"px Arial";
 ctx.fillText(t,x,y);
}

function tree(x,y){
 rectangle(x-12,y,25,34,"#754329");
 rectangle(x-28,y-28,56,45,"#147244");
 rectangle(x-22,y-39,44,25,"#218b50");
 rectangle(x-10,y-48,20,15,"#35a969");
}

function car(x,y,color){
 rectangle(x,y,76,36,color);
 rectangle(x+13,y-12,48,17,"#b7eaff");
 rectangle(x+20,y-9,17,12,"#d8f6ff");
 rectangle(x+40,y-9,17,12,"#d8f6ff");
 rectangle(x+8,y+30,16,13,"#171717");
 rectangle(x+53,y+30,16,13,"#171717");
}

function house(x,y){
 rectangle(x,y,180,120,"#d89c68");
 rectangle(x-8,y-10,196,15,"#42364e");
 rectangle(x+20,y+30,38,40,"#92dced");
 rectangle(x+85,y+30,38,40,"#92dced");
 rectangle(x+140,y+30,30,40,"#92dced");
 rectangle(x+70,y+78,42,42,"#69432f");
 text("ДОМ",x+65,y-20,20);
}

function initWorld(){
 buildings=[
 {x:300,y:100,w:180,h:120,name:"Дом"},
 {x:600,y:100,w:170,h:120,name:"Магазин"},
 {x:50,y:330,w:190,h:120,name:"Школа"},
 {x:800,y:300,w:180,h:120,name:"Работа"}
 ];
 for(let i=0;i<35;i++){
 trees.push({
 x:Math.random()*1400-200,
 y:Math.random()*1200-200
 });
 }
 cars=[
 {x:250,y:510,color:"#e83e50"},
 {x:600,y:490,color:"#2588df"},
 {x:900,y:260,color:"#26a77c"}
 ];
 npcs=[
 {x:400,y:270,name:"Вика",color:"#ef82be"},
 {x:700,y:350,name:"Артём",color:"#ed794c"},
 {x:520,y:170,name:"Алина",color:"#a56ee7"},
 {x:850,y:500,name:"Катя",color:"#5588e9"}
 ];
}
initWorld();

function drawPlayer(x,y){
 rectangle(x-10,y-22,20,25,"#e9ad87");
 rectangle(x-11,y-25,22,9,"#211b29");
 rectangle(x-12,y-1,24,26,player.clothes);
 rectangle(x-10,y+25,8,13,"#24213b");
 rectangle(x+3,y+25,8,13,"#24213b");
 rectangle(x-7,y-13,4,3,"#17121b");
 rectangle(x+4,y-13,4,3,"#17121b");
}

function drawNPC(n){
 rectangle(n.x-9,n.y-20,18,22,"#e5a482");
 rectangle(n.x-10,n.y-23,20,8,"#34222a");
 rectangle(n.x-11,n.y,22,24,n.color);
 rectangle(n.x-8,n.y+24,7,11,"#28233a");
 rectangle(n.x+3,n.y+24,7,11,"#28233a");
 text(n.name,n.x-20,n.y-30,12);
}

function drawRoad(){
 rectangle(0,250,1500,190,"#737983");
 rectangle(0,245,1500,8,"#d0cdb7");
 rectangle(0,430,1500,8,"#d0cdb7");
 for(let x=0;x<1500;x+=120){
 rectangle(x,335,60,5,"#ffe18a");
 }
}

function drawTown(){
 rectangle(-1000,-1000,3000,3000,"#79ac70");

 // дороги
 drawRoad();
 rectangle(450,-300,110,1000,"#737983");
 for(let y=-300;y<1000;y+=100)
 rectangle(500,y,7,50,"#ffe18a");

 // деревья
 for(const t of trees) tree(t.x,t.y);

 // здания
 for(const b of buildings){
 house(b.x,b.y);
 if(b.name!=="Дом") text(b.name,b.x+40,b.y-20,17);
 }

 // машины
 for(const c of cars) car(c.x,c.y,c.color);

 // NPC
 for(const n of npcs) drawNPC(n);
}

function drawInterior(){
 rectangle(0,0,1500,1000,"#d7b18b");

 // стены
 rectangle(0,0,1500,22,"#3b3047");
 rectangle(0,0,22,1000,"#3b3047");
 rectangle(1478,0,22,1000,"#3b3047");

 // разделители комнат
 rectangle(480,22,12,430,"#654b46");
 rectangle(950,22,12,430,"#654b46");
 rectangle(22,450,1456,12,"#654b46");

 // спальня
 rectangle(55,55,330,250,"#e9c8a7");
 rectangle(100,120,170,95,"#337bd8");
 rectangle(100,105,170,35,"#e9efff");
 rectangle(280,70,65,130,"#80533c");
 text("СПАЛЬНЯ",130,270,22);

 // ванная
 rectangle(500,55,400,250,"#8fc6dc");
 for(let x=520;x<900;x+=35)
 for(let y=70;y<280;y+=35)
 rectangle(x,y,30,30,"#b9e4ef");
 rectangle(560,130,100,70,"#f0f7f9");
 rectangle(720,110,110,65,"#eaf7ff");
 text("ВАННАЯ",650,280,22,"#24506c");

 // кухня
 rectangle(980,55,450,250,"#dba77c");
 rectangle(1040,75,340,60,"#ece6d9");
 rectangle(1050,85,65,40,"#a4c8df");
 rectangle(1150,85,65,40,"#353344");
 rectangle(1250,85,100,40,"#9aa6aa");
 rectangle(1120,180,160,80,"#71472f");
 text("КУХНЯ",1160,290,22);

 // гостиная
 rectangle(55,475,420,350,"#a8a0ba");
 rectangle(100,540,210,90,"#494454");
 rectangle(130,490,120,55,"#bdc7dc");
 rectangle(320,560,100,60,"#76503c");
 rectangle(330,500,80,50,"#25233b");
 text("ГОСТИНАЯ",130,790,22);

 // детская
 rectangle(500,475,930,350,"#f4a9ce");
 rectangle(650,580,200,90,"#ef7eae");
 rectangle(650,560,200,25,"#fff0f5");
 rectangle(1050,510,130,150,"#a66b44");
 rectangle(900,650,70,35,"#df9d46");
 text("ДЕТСКАЯ",830,790,22,"#74345b");

 // двери
 rectangle(650,420,100,35,"#80503b");
}

function drawMinimap(){
 const x=W-130,y=10;
 ctx.fillStyle="#100b25";
 ctx.fillRect(x,y,120,90);
 ctx.strokeStyle="#b45aff";
 ctx.lineWidth=3;
 ctx.strokeRect(x,y,120,90);
 ctx.fillStyle="#747c82";
 ctx.fillRect(x+45,y,30,90);
 ctx.fillRect(x,y+35,120,20);
 ctx.fillStyle="#79ad70";
 ctx.fillRect(x+4,y+4,36,25);
 ctx.fillStyle="#f5d3a5";
 ctx.fillRect(x+10,y+10,15,10);
 ctx.fillStyle="#ffffff";
 ctx.beginPath();
 ctx.arc(x+60,y+45,5,0,Math.PI*2);
 ctx.fill();
}

function drawHUD(){
 drawMinimap();
}

function updateCamera(){
 camera.x=player.x-W/2;
 camera.y=player.y-H/2;
}

function render(){
 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,W,H);
 updateCamera();

 const scale=Math.min(W/960,H/540);
 ctx.setTransform(scale,0,0,scale,
 (W-960*scale)/2,(H-540*scale)/2);

 ctx.save();
 ctx.translate(-camera.x,-camera.y);

 if(inside){
 drawInterior();
 drawPlayer(player.x,player.y);
 }else{
 drawTown();
 drawPlayer(player.x,player.y);
 }

 ctx.restore();
 drawHUD();
}

function collision(x,y){
 if(inside){
 return x<30||y<30||x>1460||y>820;
 }
 for(const b of buildings){
 if(x>b.x-10&&x<b.x+b.w+10&&
 y>b.y-10&&y<b.y+b.h+10){
 return true;
 }
 }
 return false;
}

function move(dx,dy){
 if(!dx&&!dy)return;
 const length=Math.hypot(dx,dy)||1;
 dx=dx/length;
 dy=dy/length;
 const speed=player.speed;
 const nx=player.x+dx*speed;
 const ny=player.y+dy*speed;

 if(!collision(nx,player.y))player.x=nx;
 if(!collision(player.x,ny))player.y=ny;

 player.moving=true;
 player.direction=dx<0?-1:1;

 xp+=0.002;
 if(xp>=100){
 xp=0;
 level++;
 document.getElementById("level").textContent=level;
 }
 document.getElementById("xp").textContent=Math.floor(xp);
}

function gameLoop(){
 gameTime++;
 let dx=0,dy=0;
 if(keys.ArrowUp||keys.w)dy--;
 if(keys.ArrowDown||keys.s)dy++;
 if(keys.ArrowLeft||keys.a)dx--;
 if(keys.ArrowRight||keys.d)dx++;
 move(dx,dy);
 render();
 requestAnimationFrame(gameLoop);
}
gameLoop();

addEventListener("keydown",e=>{
 keys[e.key]=true;
});
addEventListener("keyup",e=>{
 keys[e.key]=false;
});

function bindButton(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
 e.preventDefault();
 keys[key]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
 b.addEventListener(ev,()=>keys[key]=false);
 });
}
bindButton("up","ArrowUp");
bindButton("down","ArrowDown");
bindButton("left","ArrowLeft");
bindButton("right","ArrowRight");

function openMenu(name){
 const panel=document.getElementById("panel");
 const title=document.getElementById("panelTitle");
 const content=document.getElementById("panelContent");
 panel.style.display="block";
 title.textContent=name;
 content.innerHTML="";

 function add(label,fn){
 const b=document.createElement("button");
 b.textContent=label;
 b.style.display="block";
 b.style.width="100%";
 b.onclick=fn;
 content.appendChild(b);
 }

 if(name.includes("Дом")){
 add("🚪 Войти в дом",()=>{
 inside=true;
 player.x=750;
 player.y=400;
 closeMenu();
 notify("Ты вошёл домой!");
 });
 add("🌳 Выйти во двор",()=>{
 inside=false;
 player.x=390;
 player.y=250;
 closeMenu();
 });
 add("🛏 Отдохнуть",()=>notify("Ты отдохнул!"));
 }

 if(name.includes("Магазин")){
 add("🥪 Купить еду — 50 ₽",()=>buy(50,"Еда"));
 add("🥤 Купить напиток — 30 ₽",()=>buy(30,"Напиток"));
 add("🎁 Купить подарок — 150 ₽",()=>buy(150,"Подарок"));
 add("🪑 Мебель — 200 ₽",()=>buy(200,"Мебель"));
 }

 if(name.includes("Одежда")){
 const colors=["#8d45f4","#e74765","#368de9","#34ad77","#f0a13d"];
 colors.forEach((c,i)=>{
 add("👕 Сменить одежду "+(i+1),()=>{
 player.clothes=c;
 notify("Одежда изменена!");
 closeMenu();
 });
 });
 }

 if(name.includes("Работа")){
 add("👨‍🍳 Работа поваром +200 ₽",()=>work(200));
 add("👮 Работа полицейским +250 ₽",()=>work(250));
 add("🏪 Работа в магазине +150 ₽",()=>work(150));
 }

 if(name.includes("Семья")){
 add("💬 Познакомиться с NPC",()=>notify("Привет! Давай познакомимся!"));
 add("❤️ Семейный дом",()=>notify("Семейный дом доступен!"));
 add("👶 Детская комната",()=>{
 inside=true;
 player.x=1100;
 player.y=700;
 closeMenu();
 });
 }

 if(name.includes("Инвентарь")){
 add("🥪 Еда",()=>notify("У тебя есть еда"));
 add("🎁 Подарки",()=>notify("Инвентарь открыт"));
 add("🪑 Мебель",()=>notify("Мебель для дома"));
 }

 if(name.includes("Секреты")){
 add("💰 Получить ежедневную награду",()=>{
 money+=100;
 updateMoney();
 notify("Получено 100 ₽!");
 });
 add("⭐ Получить опыт",()=>{
 xp+=25;
 notify("Получено 25 XP!");
 });
 }

 if(name.includes("Карта")){
 add("🏠 Дом",()=>teleport(390,250));
 add("🛒 Магазин",()=>teleport(680,150));
 add("🏫 Школа",()=>teleport(150,380));
 add("💼 Работа",()=>teleport(870,350));
 }
}

function closeMenu(){
 document.getElementById("panel").style.display="none";
}

function updateMoney(){
 document.getElementById("cash").textContent=money;
}

function buy(cost,item){
 if(money<cost){
 notify("Недостаточно денег!");
 return;
 }
 money-=cost;
 updateMoney();
 notify("Куплено: "+item);
}

function work(reward){
 money+=reward;
 updateMoney();
 xp+=10;
 notify("Работа выполнена! +"+reward+" ₽");
}

function teleport(x,y){
 inside=false;
 player.x=x;
 player.y=y;
 closeMenu();
 notify("Ты переместился!");
}

function action(name){
 if(name==="Бег"){
 player.speed=5;
 setTimeout(()=>player.speed=2.5,3000);
 notify("Режим бега!");
 }
 if(name==="Прыжок"){
 player.y-=35;
 notify("Прыжок!");
 }
 if(name==="Сон"){
 notify("Пора отдыхать!");
 }
}

function notify(message){
 const h=document.getElementById("hint");
 h.textContent=message;
 h.style.display="block";
 clearTimeout(window.noticeTimer);
 window.noticeTimer=setTimeout(()=>{
 h.style.display="none";
 },2200);
}

function sendMessage(){
 const input=document.getElementById("message");
 const box=document.getElementById("messages");
 if(!input.value.trim())return;
 box.innerHTML+="<br>Кайсар: "+escapeHTML(input.value);
 input.value="";
 box.scrollTop=box.scrollHeight;
}

function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

// сохранение
function saveGame(){
 localStorage.setItem("liveFamilySave",JSON.stringify({
 player,money,xp,level
 }));
}

function loadGame(){
 try{
 const data=JSON.parse(localStorage.getItem("liveFamilySave"));
 if(!data)return;
 Object.assign(player,data.player);
 money=data.money;
 xp=data.xp;
 level=data.level;
 updateMoney();
 document.getElementById("level").textContent=level;
 }catch(e){}
}

loadGame();
setInterval(saveGame,3000);

</script>
</body>
</html>
