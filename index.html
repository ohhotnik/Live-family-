
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1,user-scalable=no">
<title>LIVE FAMILY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#151b25;color:white;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100dvh;image-rendering:pixelated}
#hud{
 position:fixed;top:10px;left:10px;right:10px;
 display:flex;justify-content:space-between;gap:8px;
 pointer-events:none
}
.panel{background:#172333dd;border:2px solid #536b7d;
 border-radius:10px;padding:9px;font-size:13px}
#hint{position:fixed;top:70px;left:50%;transform:translateX(-50%);
 background:#172333e8;padding:10px;border-radius:9px;
 display:none;text-align:center}
#controls{position:fixed;bottom:20px;left:0;right:0;
 display:flex;justify-content:space-between;padding:0 18px;
 pointer-events:none}
.group{display:flex;gap:12px;pointer-events:auto}
button{border:2px solid #9bb4c9;background:#263d52;color:white;
 border-radius:15px;min-width:58px;height:58px;font-size:22px;
 touch-action:none}
button:active{background:#527b9d}
#action{font-size:13px;width:75px}
#menu{position:fixed;inset:0;background:#101923dd;
 display:flex;align-items:center;justify-content:center}
#box{background:#203246;padding:25px;border:3px solid #8ba8bd;
 border-radius:15px;text-align:center;width:min(90%,360px)}
#box input{padding:12px;width:100%;margin:12px 0;border-radius:8px;border:0}
#box button{width:100%;height:48px;font-size:16px}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div class="panel">
  <b>LIVE FAMILY</b><br>
  <span id="nickname">Игрок</span>
 </div>
 <div class="panel">
  💰 <span id="money">1000</span> ₽<br>
  💼 <span id="job">Без работы</span>
 </div>
</div>

<div id="hint"></div>

<div id="controls">
 <div class="group">
  <button id="left">◀</button>
  <button id="right">▶</button>
 </div>
 <div class="group">
  <button id="action">ДЕЙСТВИЕ</button>
  <button id="jump">⬆</button>
 </div>
</div>

<div id="menu">
 <div id="box">
  <h1>LIVE FAMILY</h1>
  <p>Добро пожаловать в город!</p>
  <input id="name" maxlength="16" placeholder="Имя персонажа">
  <button id="start">НАЧАТЬ ИГРУ</button>
 </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const hint=document.getElementById("hint");

let W=innerWidth,H=innerHeight;
function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

let player={
 x:150,y:0,w:27,h:49,
 vx:0,vy:0,speed:3.2,
 grounded:false,
 direction:1,
 color:"#45a6e8"
};

let camera=0;
let money=1000;
let job=null;
let nickname="Игрок";
let started=false;
let keys={left:false,right:false};
let jumpPressed=false;
let actionCooldown=0;

const worldWidth=3600;
const groundY=H-95;

const buildings=[
 {x:350,w:180,h:150,name:"Дом №1",color:"#d88e63",type:"house"},
 {x:750,w:180,h:180,name:"Магазин",color:"#68a9c7",type:"shop"},
 {x:1200,w:200,h:155,name:"Центр работы",color:"#b58acb",type:"job"},
 {x:1800,w:190,h:165,name:"Дом №2",color:"#d6a75d",type:"house"},
 {x:2500,w:200,h:180,name:"Банк",color:"#83b88a",type:"bank"},
 {x:3100,w:190,h:155,name:"Дом №3",color:"#ce8292",type:"house"}
];

const trees=[200,570,1030,1500,2150,2800,3400];

let platforms=[
 {x:0,y:groundY,w:worldWidth,h:500}
];

function rect(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function drawSky(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#70b9e8");
 g.addColorStop(1,"#d2edff");
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 // Облака
 for(let i=0;i<9;i++){
  let x=(i*440-camera*.3)%(W+300);
  if(x< -200)x+=W+300;
  rect(x,90+(i%3)*45,65,20,"#ffffff");
  rect(x+15,75+(i%3)*45,55,20,"#ffffff");
  rect(x+35,90+(i%3)*45,55,20,"#ffffff");
 }
}

function drawTree(x){
 let sx=x-camera;
 rect(sx+17,groundY-65,15,65,"#80502e");
 rect(sx-5,groundY-105,60,45,"#278c49");
 rect(sx+5,groundY-130,45,40,"#38a653");
 rect(sx+15,groundY-145,25,25,"#4dbb63");
}

function drawBuilding(b){
 let x=b.x-camera;
 let y=groundY-b.h;

 // Здание
 rect(x,y,b.w,b.h,b.color);
 rect(x-5,y-10,b.w+10,15,"#554a50");

 // Окна
 for(let i=0;i<3;i++){
  rect(x+20+i*52,y+35,32,35,"#a9e5f7");
  rect(x+34+i*52,y+35,4,35,"#e9f5ff");
 }
 // Дверь
 rect(x+b.w/2-19,groundY-58,38,58,"#68432f");
 rect(x+b.w/2+10,groundY-30,5,5,"#f7d45b");

 // Вывеска
 ctx.fillStyle="#172333";
 ctx.font="bold 15px Arial";
 ctx.textAlign="center";
 ctx.fillText(b.name,x+b.w/2,y-18);
}

function drawGround(){
 rect(0,groundY,W,H-groundY,"#69a94c");
 rect(0,groundY,W,8,"#a4d66a");

 // Текстура травы
 for(let i=0;i<100;i++){
  let x=(i*97-camera*.8)%(W+50);
  if(x<0)x+=W+50;
  rect(x,groundY+15+(i%5)*9,4,7,"#4f913d");
 }
 rect(0,groundY+60,W,8,"#b88b59");
 rect(0,groundY+68,W,H-groundY-68,"#c6a16e");
}

function drawPlayer(){
 let x=player.x-camera;
 let y=player.y;

 // Ноги
 rect(x+4,y+34,8,15,"#263b68");
 rect(x+16,y+34,8,15,"#263b68");

 // Тело
 rect(x+3,y+17,22,22,player.color);
 rect(x+5,y+12,18,24,player.color);

 // Голова
 rect(x+4,y,20,19,"#f0bd91");
 rect(x+2,y-3,23,8,"#513b30");

 // Глаза
 rect(x+7,y+7,3,3,"#202020");
 rect(x+18,y+7,3,3,"#202020");

 // Руки
 rect(x-2,y+20,6,17,"#f0bd91");
 rect(x+23,y+20,6,17,"#f0bd91");
}

function drawWorld(){
 drawSky();
 drawGround();

 trees.forEach(drawTree);
 buildings.forEach(drawBuilding);

 // Указатель над персонажем
 ctx.fillStyle="#ffffff";
 ctx.font="12px Arial";
 ctx.textAlign="center";
 ctx.fillText(nickname,player.x-camera+14,player.y-13);

 drawPlayer();
}

function nearBuilding(){
 let center=player.x+player.w/2;
 return buildings.find(b=>
  Math.abs(center-(b.x+b.w/2))<b.w/2+55
 );
}

function showHint(text){
 hint.textContent=text;
 hint.style.display="block";
}

function hideHint(){
 hint.style.display="none";
}

function interact(){
 let b=nearBuilding();
 if(!b){showHint("Подойди к зданию");return;}

 if(b.type==="house"){
  showHint("🏠 "+b.name+" — дом пока закрыт");
 }
 if(b.type==="shop"){
  showHint("🛒 Магазин: товары скоро появятся");
 }
 if(b.type==="job"){
  if(!job){
   job="Курьер";
   document.getElementById("job").textContent=job;
   showHint("💼 Ты устроился курьером! Выполняй задания.");
  }else{
   showHint("Ты уже работаешь: "+job);
  }
 }
 if(b.type==="bank"){
  showHint("🏦 Банк: твой баланс "+money+" ₽");
 }
}

function earn(){
 if(!job){
  showHint("Сначала устройся на работу!");
  return;
 }
 money+=100;
 document.getElementById("money").textContent=money;
 showHint("📦 Задание выполнено! +100 ₽");
}

function update(){
 if(!started)return;

 const acceleration=.65;
 const friction=.78;

 if(keys.left){
  player.vx-=acceleration;
  player.direction=-1;
 }
 if(keys.right){
  player.vx+=acceleration;
  player.direction=1;
 }

 player.vx*=friction;
 player.vx=Math.max(-player.speed,Math.min(player.speed,player.vx));

 player.x+=player.vx;

 // Границы мира
 player.x=Math.max(0,Math.min(worldWidth-player.w,player.x));

 // Гравитация
 player.vy+=.65;
 player.y+=player.vy;

 if(player.y+player.h>=groundY){
  player.y=groundY-player.h;
  player.vy=0;
  player.grounded=true;
 }else{
  player.grounded=false;
 }

 if(jumpPressed&&player.grounded){
  player.vy=-11;
  player.grounded=false;
 }
 jumpPressed=false;

 // Камера
 camera=player.x-W*.42;
 camera=Math.max(0,Math.min(worldWidth-W,camera));

 if(actionCooldown>0)actionCooldown--;
}

function loop(){
 update();
 ctx.clearRect(0,0,W,H);
 drawWorld();
 requestAnimationFrame(loop);
}

function bindButton(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>{
  el.addEventListener(ev,()=>keys[key]=false);
 });
}

bindButton("left","left");
bindButton("right","right");

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 jumpPressed=true;
});

document.getElementById("action").addEventListener("click",()=>{
 interact();
});

addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key===" "||e.key==="ArrowUp")jumpPressed=true;
 if(e.key==="e"||e.key==="Enter")interact();
});

addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

document.getElementById("start").onclick=()=>{
 nickname=document.getElementById("name").value.trim()||"Игрок";
 document.getElementById("nickname").textContent=nickname;
 document.getElementById("menu").style.display="none";
 player.y=groundY-player.h;
 started=true;
};

loop();
</script>
</body>
</html>
