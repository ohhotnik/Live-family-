
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIVE FAMILY 2D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10151d;color:#fff;font:14px Arial;overflow:hidden;touch-action:none}
#game{position:fixed;inset:0;background:#79a85d}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.top{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.panel{background:#171326ef;border:2px solid #a64cff;border-radius:12px;padding:8px;box-shadow:0 0 12px #7c25c9}
.top .panel{font-weight:bold}
.left{position:fixed;left:8px;top:72px;display:grid;gap:6px}
button{background:#38204f;color:white;border:1px solid #bd75ff;border-radius:9px;padding:9px 10px;font-weight:bold}
button:active{background:#8244bd}
.right{position:fixed;right:8px;top:72px;display:grid;gap:6px}
#joy{position:fixed;left:18px;bottom:18px;width:112px;height:112px;border-radius:50%;background:#17132699;border:2px solid #d49aff;display:grid;place-items:center}
#nub{width:44px;height:44px;border-radius:50%;background:#b65cff;border:2px solid white}
.actions{position:fixed;right:14px;bottom:18px;display:grid;grid-template-columns:repeat(2,64px);gap:7px}
#toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);max-width:80%;text-align:center}
#modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px}
#modal .panel{width:min(420px,100%);max-height:85vh;overflow:auto}
#modal h2{margin:2px 0 12px;color:#d6a2ff}
#cmd{width:100%;padding:11px;border-radius:8px;background:#0e0b17;color:white;border:1px solid #a64cff;margin:8px 0}
.small{opacity:.8;font-size:12px}
@media(min-width:700px){.left{top:90px}.right{top:90px}}
</style>
</head>
<body>

<div id="game"><canvas id="world"></canvas></div>

<div class="top">
 <div class="panel">💜 LIVE FAMILY<br><span class="small" id="nick">Игрок • Уровень 1</span></div>
 <div class="panel">💰 <span id="cash">2500</span><br>⭐ <span id="level">1</span></div>
</div>

<div class="left">
 <button onclick="openMenu('Персонаж','Выбери пол и имя персонажа.')">👤 Персонаж</button>
 <button onclick="openMenu('Магазин','Одежда • мебель • транспорт')">🛍 Магазин</button>
 <button onclick="openMenu('Работа','Выбери работу и получи игровую зарплату.')">💼 Работа</button>
 <button onclick="openMenu('Дом','Твой игровой дом и мебель.')">🏠 Дом</button>
 <button onclick="openFamily()">💜 Семья</button>
 <button onclick="openMenu('Карта','Город: парк, магазин, больница, дома.')">🗺 Карта</button>
 <button onclick="openCommands()">⌨ Команды</button>
</div>

<div class="right">
 <div class="panel">🧭 Мини-карта<br><canvas id="mini" width="100" height="76"></canvas></div>
 <button onclick="openMenu('Инвентарь','В инвентаре пока пусто.')">🎒 Инвентарь</button>
 <button onclick="toast('Чат доступен в онлайн-версии с сервером.')">💬 Чат</button>
</div>

<div id="joy"><div id="nub"></div></div>

<div class="actions">
 <button onclick="toast('Персонаж побежал!')">🏃 Бег</button>
 <button onclick="toast('Прыжок!')">⬆ Прыжок</button>
 <button onclick="interact()">🤝 Действие</button>
 <button onclick="toast('Телефон открыт')">📱 Телефон</button>
</div>

<div id="toast" class="panel">Добро пожаловать в LIVE FAMILY!</div>

<div id="modal">
 <div class="panel">
  <h2 id="mtitle"></h2>
  <div id="mbody"></div>
  <button onclick="closeModal()">Закрыть</button>
 </div>
</div>

<script>
const c=document.getElementById('world');
const ctx=c.getContext('2d');
const mini=document.getElementById('mini').getContext('2d');

let W=0,H=0,px=480,py=360,keys={};
let cash=2500;
let bot={x:560,y:360,name:'Вика',follow:true};

let save=JSON.parse(localStorage.getItem('lf2d')||'{}');
let family=save.family||{
 partner:'',
 child:'',
 month:0,
 start:0
};

function resize(){
 W=c.width=innerWidth*devicePixelRatio;
 H=c.height=innerHeight*devicePixelRatio;
}
addEventListener('resize',resize);
resize();

function toast(t){
 let e=document.getElementById('toast');
 e.textContent=t;
 e.style.display='block';
 clearTimeout(window.tt);
 window.tt=setTimeout(()=>e.style.display='none',2400);
}

function persist(){
 localStorage.setItem('lf2d',JSON.stringify({family,cash}));
}

function openMenu(title,body){
 document.getElementById('mtitle').textContent=title;
 document.getElementById('mbody').innerHTML='<p>'+body+'</p>';
 document.getElementById('modal').style.display='grid';
}

function closeModal(){
 document.getElementById('modal').style.display='none';
}

function openFamily(){
 let s=family.partner?'Партнёр: '+family.partner:'Партнёр пока не выбран';
 let child=family.child?'Ребёнок: '+family.child:'Детей пока нет';
 let month=family.start?
 Math.min(9,Math.floor((Date.now()-family.start)/86400000)+1):0;

 openMenu('Семья',
 `${s}<br>${child}<br>
 Месяц семейного события: ${month}/9<br><br>
 <button onclick="chooseBot()">Выбрать бота-партнёра</button>
 <button onclick="sweetNight()">Романтический вечер</button>
 <button onclick="pregnancy()">Семейное событие</button>
 <button onclick="birth()">Рождение ребёнка</button>`);
}

function chooseBot(){
 family.partner='Вика (бот)';
 bot.follow=true;
 persist();
 toast('Вика теперь твой игровой партнёр!');
 openFamily();
}

function sweetNight(){
 if(!family.partner){
  toast('Сначала выбери партнёра.');
  return;
 }
 toast('🌙 Вы провели романтический вечер.');
 closeModal();
}

function pregnancy(){
 if(!family.partner){
  toast('Сначала выбери партнёра.');
  return;
 }
 family.start=Date.now();
 family.month=1;
 persist();
 toast('Семейный сюжет начался. Срок: 1 игровой месяц.');
 openFamily();
}

function birth(){
 if(!family.start){
  toast('Сначала начни семейное событие.');
  return;
 }

 let m=Math.min(9,Math.floor((Date.now()-family.start)/86400000)+1);

 if(m<9){
  toast('Ещё рано: прошло '+m+' из 9 игровых месяцев.');
  return;
 }

 family.child='Сын';
 family.start=0;
 persist();
 toast('👶 В семье появился сын!');
 openFamily();
}

function openCommands(){
 openMenu('Команды',
 `<p>
 /help — список команд<br>
 /partner — найти партнёра<br>
 /botpartner — выбрать бота<br>
 /follow — бот следует за тобой<br>
 /stopfollow — остановить бота<br>
 /sweetnight — романтический вечер<br>
 /pregnancy — семейный сюжет<br>
 /month — срок в игровых месяцах<br>
 /birth — рождение ребёнка<br>
 /family — открыть семью<br>
 /home — домой<br>
 /car — транспорт<br>
 /money — деньги
 </p>
 <input id="cmd" placeholder="Введи команду">
 <button onclick="runCommand()">Выполнить</button>`);
}

function runCommand(){
 let v=document.getElementById('cmd').value.trim().toLowerCase();
 closeModal();

 let map={
 '/help':openCommands,
 '/partner':()=>toast('Используй /botpartner для игрового бота.'),
 '/botpartner':chooseBot,
 '/follow':()=>{
  bot.follow=true;
  toast('Бот следует за тобой');
 },
 '/stopfollow':()=>{
  bot.follow=false;
  toast('Бот остановился');
 },
 '/sweetnight':sweetNight,
 '/pregnancy':pregnancy,
 '/birth':birth,
 '/family':openFamily,
 '/home':()=>{
  px=480;
  py=360;
  toast('Ты дома');
 },
 '/car':()=>toast('Машина появится в гараже в следующей версии.'),
 '/money':()=>toast('Деньги: '+cash),
 '/month':()=>{
  toast(family.start?
  'Месяц '+Math.min(9,Math.floor((Date.now()-family.start)/86400000)+1)+' из 9':
  'Семейное событие не началось');
 }
 };

 if(map[v])map[v]();
 else toast('Команда не найдена. Напиши /help');
}

function interact(){
 toast('Рядом нет объекта для взаимодействия.');
}

let joy=document.getElementById('joy');
let nub=document.getElementById('nub');
let moving=false,dx=0,dy=0;

joy.addEventListener('pointerdown',e=>{
 moving=true;
 joy.setPointerCapture(e.pointerId);
 moveJoy(e);
});

joy.addEventListener('pointermove',e=>{
 if(moving)moveJoy(e);
});

joy.addEventListener('pointerup',()=>{
 moving=false;
 dx=dy=0;
 nub.style.transform='translate(0,0)';
});

function moveJoy(e){
 let r=joy.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 let l=Math.hypot(x,y)||1;

 x*=Math.min(1,42/l);
 y*=Math.min(1,42/l);

 dx=x/42;
 dy=y/42;

 nub.style.transform=`translate(${x}px,${y}px)`;
}

function rect(x,y,w,h,col){
 ctx.fillStyle=col;
 ctx.fillRect(x,y,w,h);
}

function draw(){
 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,W,H);
 ctx.scale(devicePixelRatio,devicePixelRatio);

 let sw=innerWidth,sh=innerHeight;

 ctx.save();
 ctx.translate(sw/2-px,sh/2-py);

 rect(-2000,-2000,4000,4000,'#79a85d');

 // Дороги
 rect(-2000,250,4000,150,'#777b7c');
 rect(250,-2000,150,4000,'#777b7c');

 for(let i=-1800;i<1800;i+=90){
  rect(i,322,45,6,'#f5e7a5');
  rect(322,i,6,45,'#f5e7a5');
 }

 // Здания
 let buildings=[
  [-250,30,150,130,'#d9b47a','МАГАЗИН'],
  [500,20,170,140,'#bd8eae','ДОМ'],
  [-250,500,160,130,'#d6d1bd','РАБОТА'],
  [520,500,160,130,'#9bb9d0','КЛИНИКА']
 ];

 for(let b of buildings){
  rect(b[0],b[1],b[2],b[3],b[4]);
  rect(b[0]+12,b[1]+12,b[2]-24,22,'#63465c');

  ctx.fillStyle='white';
  ctx.font='bold 14px Arial';
  ctx.fillText(b[5],b[0]+22,b[1]+29);

  for(let x=b[0]+25;x<b[0]+b[2]-15;x+=45){
   rect(x,b[1]+55,22,30,'#83c9df');
  }
 }

 // Деревья
 for(let x=-500;x<900;x+=150){
  for(let y=-300;y<850;y+=150){
   if(Math.abs(x)<150&&Math.abs(y)<180)continue;

   rect(x,y,22,30,'#80552f');
   ctx.fillStyle='#347e43';
   ctx.beginPath();
   ctx.arc(x+11,y,27,0,7);
   ctx.fill();
  }
 }

 drawPerson(px,py,'#7c3aed','Ты');
 drawPerson(bot.x,bot.y,'#e56b9c',bot.name);

 ctx.restore();

 // Мини-карта
 mini.fillStyle='#18251b';
 mini.fillRect(0,0,100,76);

 mini.fillStyle='#777';
 mini.fillRect(0,33,100,10);
 mini.fillRect(45,0,10,76);

 mini.fillStyle='#b65cff';
 mini.fillRect(47,35,5,5);

 mini.fillStyle='#f58ab5';
 mini.fillRect(57,38,4,4);

 requestAnimationFrame(draw);
}

function drawPerson(x,y,color,label){
 rect(x-9,y-3,18,18,'#4b382d');

 ctx.fillStyle=color;
 ctx.fillRect(x-10,y-20,20,22);

 ctx.fillStyle='#f2c6a0';
 ctx.fillRect(x-8,y-34,16,14);

 ctx.fillStyle='#fff';
 ctx.font='12px Arial';
 ctx.textAlign='center';
 ctx.fillText(label,x,y-40);
}

let last=0;

function update(t){
 let dt=Math.min(.04,(t-last)/1000||0);
 last=t;

 px+=dx*150*dt;
 py+=dy*150*dt;

 if(bot.follow){
  let ax=px-bot.x;
  let ay=py-bot.y;
  let d=Math.hypot(ax,ay);

  if(d>42){
   bot.x+=ax/d*95*dt;
   bot.y+=ay/d*95*dt;
  }
 }

 requestAnimationFrame(update);
}

draw();
requestAnimationFrame(update);
</script>
</body>
</html>
