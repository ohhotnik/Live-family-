
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LIVE FAMILY 2D</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#171729;color:white;font-family:Arial,sans-serif;
 touch-action:none
}
button,input,select{font:inherit}
button{
 border:0;border-radius:12px;padding:11px;
 background:#8b55ed;color:white;font-weight:bold;
 cursor:pointer
}
button:active{transform:scale(.96)}
#creator{
 position:fixed;inset:0;z-index:10;
 display:flex;align-items:center;justify-content:center;
 background:#171329;padding:12px
}
.panel{
 width:min(430px,100%);max-height:95vh;overflow:auto;
 padding:20px;background:#29213f;border-radius:20px
}
.panel h1{text-align:center;color:#c9a6ff}
.panel label{display:block;margin-top:10px}
.panel input,.panel select{
 width:100%;padding:12px;margin-top:5px;
 border:0;border-radius:10px;background:#413957;color:white
}
#start{width:100%;margin-top:18px;padding:15px}
#game{display:none;position:fixed;inset:0}
canvas{
 display:block;width:100%;height:100%;
 image-rendering:pixelated
}
#top{
 position:absolute;top:7px;left:7px;right:7px;
 display:flex;justify-content:space-between;gap:5px;
 pointer-events:none
}
.info{
 background:#171729dd;border-radius:10px;
 padding:9px;font-size:12px
}
#buttons{
 position:absolute;right:7px;top:53px;
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:5px;width:150px
}
#buttons button{font-size:11px;padding:10px 4px}
#stick{
 position:absolute;left:17px;bottom:20px;
 width:112px;height:112px;border-radius:50%;
 border:2px solid #ffffff66;background:#ffffff25;
 touch-action:none
}
#knob{
 position:absolute;left:32px;top:32px;
 width:44px;height:44px;border-radius:50%;
 background:#c9a6ff;pointer-events:none
}
#action{
 position:absolute;right:20px;bottom:35px;
 width:76px;height:76px;border-radius:50%;
 background:#a855f7;font-size:11px
}
#chat{
 position:absolute;left:7px;bottom:140px;
 width:180px;padding:8px;border-radius:10px;
 background:#171729dd;font-size:11px
}
#messages{max-height:45px;overflow:hidden}
#chat input{
 width:100%;margin-top:5px;padding:7px;
 border:0;border-radius:7px;background:#403853;color:white
}
#modal{
 display:none;position:absolute;inset:0;z-index:20;
 align-items:center;justify-content:center;
 padding:12px;background:#000a
}
#modal .panel{max-width:390px}
#toast{
 display:none;position:absolute;z-index:30;
 top:48px;left:50%;transform:translateX(-50%);
 padding:10px 15px;background:#35264f;
 border-radius:10px;text-align:center
}
.small{font-size:12px;color:#d5c7ec}
</style>
</head>

<body>

<div id="creator">
 <div class="panel">
  <h1>💜 LIVE FAMILY 2D</h1>
  <p style="text-align:center">Создай своего персонажа</p>

  <label>Имя персонажа</label>
  <input id="name" maxlength="16" placeholder="Например, Kaiser">

  <label>Пол</label>
  <select id="gender">
   <option>Мужской</option>
   <option>Женский</option>
  </select>

  <label>Профессия</label>
  <select id="job">
   <option>Житель</option>
   <option>Полицейский</option>
   <option>Врач</option>
   <option>Повар</option>
   <option>Таксист</option>
   <option>Строитель</option>
   <option>Бизнесмен</option>
   <option>Блогер</option>
   <option>Спасатель</option>
   <option>Учитель</option>
  </select>

  <label>Цвет кожи</label>
  <select id="skin">
   <option value="#f1c6a5">Светлый</option>
   <option value="#bd805b">Смуглый</option>
   <option value="#75452f">Тёмный</option>
  </select>

  <label>Одежда</label>
  <select id="clothes">
   <option value="#9855ee">Фиолетовая</option>
   <option value="#267bea">Синяя</option>
   <option value="#df4e5b">Красная</option>
   <option value="#239c65">Зелёная</option>
   <option value="#e69b32">Оранжевая</option>
  </select>

  <button id="start">▶ НАЧАТЬ ИГРУ</button>
  <p class="small">Одиночная игра работает без интернета.</p>
 </div>
</div>

<div id="game">
 <canvas id="world"></canvas>

 <div id="top">
  <div class="info" id="playerInfo">Игрок</div>
  <div class="info" id="money">💰 1000</div>
 </div>

 <div id="buttons">
  <button onclick="hello()">👋 Привет</button>
  <button onclick="dance()">💃 Танец</button>
  <button onclick="goHome()">🏠 Дом</button>
  <button onclick="work()">💼 Работа</button>
  <button onclick="useCar()">🚗 Машина</button>
  <button onclick="showCommands()">⌨ Команды</button>
  <button onclick="changeClothes()">👕 Одежда</button>
  <button onclick="showMap()">🗺 Карта</button>
  <button onclick="showBots()">🤖 Боты</button>
  <button onclick="showFamily()">👨‍👩‍👧 Семья</button>
 </div>

 <div id="chat">
  <div id="messages">Добро пожаловать в LIVE FAMILY!</div>
  <input id="chatInput" placeholder="Написать сообщение">
 </div>

 <div id="stick"><div id="knob"></div></div>
 <button id="action" onclick="nearAction()">ДЕЙСТВИЕ</button>
 <div id="toast"></div>
</div>

<div id="modal">
 <div class="panel">
  <h2 id="modalTitle">Меню</h2>
  <div id="modalContent"></div>
  <button style="width:100%;margin-top:12px" onclick="closeModal()">Закрыть</button>
 </div>
</div>

<script>
"use strict";

/* ОСНОВНЫЕ ДАННЫЕ */

const canvas=document.getElementById("world");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;
let DPR=1;

const WORLD_W=2200;
const WORLD_H=1700;

let started=false;
let animationId=0;
let lastTime=0;

let player={
 x:1050,
 y:850,
 name:"Игрок",
 gender:"Мужской",
 job:"Житель",
 skin:"#f1c6a5",
 clothes:"#9855ee",
 money:1000,
 speed:190,
 direction:1
};

let camera={x:0,y:0};
let joy={x:0,y:0};
let keys={};
let bots=[];
let cars=[];
let trees=[];
let gameTime=0;

const buildings=[
 {x:250,y:200,w:230,h:170,c:"#d5a06c",name:"ДОМ"},
 {x:650,y:170,w:240,h:180,c:"#7c9fbd",name:"МАГАЗИН"},
 {x:1200,y:200,w:250,h:180,c:"#b69acb",name:"ДОМ"},
 {x:1650,y:180,w:250,h:190,c:"#d2a66f",name:"КАФЕ"},
 {x:250,y:1100,w:270,h:190,c:"#c38c78",name:"БОЛЬНИЦА"},
 {x:800,y:1120,w:280,h:190,c:"#8b9ea9",name:"ШКОЛА"},
 {x:1450,y:1100,w:260,h:190,c:"#b5a1cc",name:"ПОЛИЦИЯ"}
];

const botNames=[
 "Вика","Максим","Аня","Дима","Саша","Маша",
 "Илья","София","Артём","Катя","Даня","Лиза",
 "Миша","Алина","Рома","Настя","Егор","Оля"
];

const botJobs=[
 "Житель","Полицейский","Врач","Повар",
 "Таксист","Учитель","Строитель"
];

const botColors=[
 "#e75d83","#40a99a","#e2a33e",
 "#678be8","#b47ce3","#d36e48"
];

function resize(){
 W=innerWidth;
 H=innerHeight;
 DPR=Math.min(devicePixelRatio||1,2);

 canvas.width=Math.round(W*DPR);
 canvas.height=Math.round(H*DPR);

 canvas.style.width=W+"px";
 canvas.style.height=H+"px";

 ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* СОЗДАНИЕ ИГРЫ */

document.getElementById("start").addEventListener("click",startGame);

function startGame(){
 if(started)return;

 player.name=document.getElementById("name").value.trim()||"Игрок";
 player.gender=document.getElementById("gender").value;
 player.job=document.getElementById("job").value;
 player.skin=document.getElementById("skin").value;
 player.clothes=document.getElementById("clothes").value;

 try{
  const saved=JSON.parse(localStorage.getItem("liveFamilySave")||"null");
  if(saved && saved.name===player.name){
   player.money=Number(saved.money)||1000;
  }
 }catch(e){}

 document.getElementById("creator").style.display="none";
 document.getElementById("game").style.display="block";

 document.getElementById("playerInfo").textContent=
 "👤 "+player.name+" · "+player.job;

 updateMoney();
 createBots();
 createCars();
 createTrees();

 started=true;
 lastTime=performance.now();
 requestAnimationFrame(loop);

 say("Город загружен! Приятной игры!");
}

/* БОТЫ */

function createBots(){
 bots=[];

 for(let i=0;i<botNames.length;i++){
  bots.push({
   name:botNames[i],
   job:botJobs[i%botJobs.length],
   x:350+Math.random()*1500,
   y:400+Math.random()*850,
   color:botColors[i%botColors.length],
   skin:["#f1c6a5","#bd805b","#75452f"][i%3],
   dx:0,
   dy:0,
   timer:Math.random()*3,
   speed:35+Math.random()*25,
   mood:"гуляет"
  });
 }
}

function updateBots(dt){
 for(const b of bots){
  b.timer-=dt;

  if(b.timer<=0){
   b.dx=Math.random()*2-1;
   b.dy=Math.random()*2-1;
   b.timer=1+Math.random()*3;
  }

  b.x+=b.dx*b.speed*dt;
  b.y+=b.dy*b.speed*dt;

  b.x=Math.max(30,Math.min(WORLD_W-30,b.x));
  b.y=Math.max(30,Math.min(WORLD_H-30,b.y));
 }
}

/* МАШИНЫ */

function createCars(){
 cars=[];

 const colors=["#d94e4e","#367ed0","#e6b83d",
 "#eeeeee","#333b4b","#35a27d"];

 for(let i=0;i<12;i++){
  cars.push({
   x:300+i*130,
   y:520+(i%3)*55,
   color:colors[i%colors.length]
  });
 }
}

/* ДЕРЕВЬЯ */

function createTrees(){
 trees=[];

 for(let i=0;i<110;i++){
  let x=Math.random()*WORLD_W;
  let y=Math.random()*WORLD_H;

  if(Math.abs(y-600)<100)continue;

  trees.push({x,y});
 }
}

/* РИСОВАНИЕ */

function worldRect(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(
  Math.round(x-camera.x),
  Math.round(y-camera.y),
  w,h
 );
}

function worldText(text,x,y,size=14,color="white"){
 ctx.fillStyle=color;
 ctx.font="bold "+size+"px Arial";
 ctx.textAlign="center";
 ctx.fillText(text,x-camera.x,y-camera.y);
 ctx.textAlign="left";
}

function drawGround(){
 ctx.fillStyle="#76a86b";
 ctx.fillRect(0,0,W,H);

 /* Дороги */
 worldRect(0,570,WORLD_W,170,"#777d84");
 worldRect(1040,0,170,WORLD_H,"#777d84");

 /* Тротуары */
 worldRect(0,555,WORLD_W,15,"#b8b8a5");
 worldRect(0,740,WORLD_W,15,"#b8b8a5");
 worldRect(1025,0,15,WORLD_H,"#b8b8a5");
 worldRect(1210,0,15,WORLD_H,"#b8b8a5");

 /* Разметка */
 for(let x=0;x<WORLD_W;x+=100){
  worldRect(x,650,55,5,"#f3dc83");
 }
 for(let y=0;y<WORLD_H;y+=100){
  worldRect(1120,y,5,55,"#f3dc83");
 }
}

function drawTrees(){
 for(const t of trees){
  worldRect(t.x-7,t.y+15,14,22,"#74452c");
  worldRect(t.x-20,t.y-15,40,38,"#267349");
  worldRect(t.x-14,t.y-28,28,25,"#399457");
  worldRect(t.x-5,t.y-34,12,12,"#52a963");
 }
}

function drawBuilding(b){
 worldRect(b.x+8,b.y+10,b.w,b.h,"#465149");
 worldRect(b.x,b.y,b.w,b.h,b.c);

 /* Крыша */
 worldRect(b.x-5,b.y-9,b.w+10,13,"#55505d");

 /* Верхняя полоса */
 worldRect(b.x+12,b.y+12,b.w-24,23,"#e9e3d6");

 /* Окна */
 for(let x=b.x+25;x<b.x+b.w-25;x+=60){
  worldRect(x,b.y+55,32,39,"#9ed9ed");
  worldRect(x,b.y+108,32,35,"#9ed9ed");
  worldRect(x+14,b.y+55,3,39,"#d6f2ff");
 }

 /* Дверь */
 worldRect(b.x+b.w/2-20,b.y+b.h-55,40,55,"#68452f");
 worldRect(b.x+b.w/2+10,b.y+b.h-28,5,5,"#f2d16e");

 worldText(b.name,b.x+b.w/2,b.y-16,15);
}

function drawCars(){
 for(const c of cars){
  worldRect(c.x,c.y,72,32,c.color);
  worldRect(c.x+13,c.y-11,45,14,"#9bd4e4");
  worldRect(c.x+17,c.y-8,15,10,"#d4eff8");
  worldRect(c.x+37,c.y-8,15,10,"#d4eff8");
  worldRect(c.x+8,c.y+26,15,12,"#24242b");
  worldRect(c.x+51,c.y+26,15,12,"#24242b");
 }
}

function drawPerson(p,isPlayer=false){
 const x=Math.round(p.x-camera.x);
 const y=Math.round(p.y-camera.y);

 /* Тень */
 ctx.fillStyle="#0005";
 ctx.fillRect(x-10,y+6,21,5);

 /* Ноги */
 ctx.fillStyle="#333344";
 ctx.fillRect(x-7,y+5,6,10);
 ctx.fillRect(x+2,y+5,6,10);

 /* Тело */
 ctx.fillStyle=isPlayer?p.clothes:p.color;
 ctx.fillRect(x-10,y-15,20,22);

 /* Руки */
 ctx.fillRect(x-14,y-12,4,16);
 ctx.fillRect(x+10,y-12,4,16);

 /* Голова */
 ctx.fillStyle=p.skin||"#f1c6a5";
 ctx.fillRect(x-8,y-31,16,16);

 /* Волосы */
 ctx.fillStyle="#30232a";
 ctx.fillRect(x-9,y-34,18,6);
 ctx.fillRect(x-9,y-29,4,5);

 /* Глаза */
 ctx.fillStyle="#29212a";
 ctx.fillRect(x-4,y-25,2,2);
 ctx.fillRect(x+3,y-25,2,2);

 worldText(p.name,x,y-40,11);

 if(!isPlayer){
  worldText(p.job,x,y-50,9,"#fff1a6");
 }
}

function drawWorld(){
 drawGround();
 drawTrees();

 for(const b of buildings)drawBuilding(b);

 drawCars();

 /* Персонажи */
 for(const b of bots)drawPerson(b,false);

 drawPerson(player,true);
}

/* КАМЕРА И ДВИЖЕНИЕ */

function updatePlayer(dt){
 let dx=joy.x;
 let dy=joy.y;

 if(keys.ArrowRight||keys.d||keys.D)dx+=1;
 if(keys.ArrowLeft||keys.a||keys.A)dx-=1;
 if(keys.ArrowDown||keys.s||keys.S)dy+=1;
 if(keys.ArrowUp||keys.w||keys.W)dy-=1;

 const len=Math.hypot(dx,dy);

 if(len>0){
  dx/=len;
  dy/=len;

  player.x+=dx*player.speed*dt;
  player.y+=dy*player.speed*dt;

  if(dx!==0)player.direction=dx;
 }

 player.x=Math.max(20,Math.min(WORLD_W-20,player.x));
 player.y=Math.max(20,Math.min(WORLD_H-20,player.y));

 camera.x=player.x-W/2;
 camera.y=player.y-H/2;

 camera.x=Math.max(0,Math.min(WORLD_W-W,camera.x));
 camera.y=Math.max(0,Math.min(WORLD_H-H,camera.y));
}

/* ИГРОВОЙ ЦИКЛ */

function loop(time){
 if(!started)return;

 let dt=Math.min((time-lastTime)/1000,0.05);
 lastTime=time;
 gameTime+=dt;

 updatePlayer(dt);
 updateBots(dt);

 ctx.clearRect(0,0,W,H);
 drawWorld();

 animationId=requestAnimationFrame(loop);
}

/* ДЖОЙСТИК */

const stick=document.getElementById("stick");
const knob=document.getElementById("knob");

let stickPointer=null;

function moveStick(e){
 const r=stick.getBoundingClientRect();

 let x=e.clientX-r.left-56;
 let y=e.clientY-r.top-56;

 const max=35;
 const len=Math.hypot(x,y);

 if(len>max){
  x=x/len*max;
  y=y/len*max;
 }

 joy.x=x/max;
 joy.y=y/max;

 knob.style.left=(32+x)+"px";
 knob.style.top=(32+y)+"px";
}

function resetStick(){
 stickPointer=null;
 joy.x=0;
 joy.y=0;
 knob.style.left="32px";
 knob.style.top="32px";
}

stick.addEventListener("pointerdown",e=>{
 stickPointer=e.pointerId;
 stick.setPointerCapture(e.pointerId);
 moveStick(e);
});

stick.addEventListener("pointermove",e=>{
 if(stickPointer===e.pointerId)moveStick(e);
});

stick.addEventListener("pointerup",resetStick);
stick.addEventListener("pointercancel",resetStick);

addEventListener("keydown",e=>{
 keys[e.key]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)){
  e.preventDefault();
 }
});

addEventListener("keyup",e=>{
 keys[e.key]=false;
});

/* СООБЩЕНИЯ */

function say(message){
 const box=document.getElementById("messages");
 box.textContent=message;

 const toast=document.getElementById("toast");
 toast.textContent=message;
 toast.style.display="block";

 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>{
  toast.style.display="none";
 },2300);
}

function hello(){
 say("Ты поздоровался с жителями города!");
}

function dance(){
 say(player.name+" танцует!");
}

function goHome(){
 player.x=330;
 player.y=420;
 say("Ты пришёл домой!");
}

function work(){
 player.money+=100;
 updateMoney();
 saveGame();
 say("Работа выполнена! Ты получил 100 монет.");
}

function updateMoney(){
 document.getElementById("money").textContent="💰 "+player.money;
}

function useCar(){
 let nearest=null;
 let distance=Infinity;

 for(const c of cars){
  const d=Math.hypot(c.x-player.x,c.y-player.y);
  if(d<distance){distance=d;nearest=c;}
 }

 if(nearest && distance<130){
  player.x=nearest.x;
  player.y=nearest.y;
  say("Ты сел в машину!");
 }else{
  say("Подойди ближе к машине.");
 }
}

function nearAction(){
 let nearest=null;
 let distance=Infinity;

 for(const b of bots){
  const d=Math.hypot(b.x-player.x,b.y-player.y);
  if(d<distance){distance=d;nearest=b;}
 }

 if(nearest && distance<110){
  say(nearest.name+": Привет! Рад тебя видеть!");
 }else{
  say("Рядом нет жителей. Подойди к боту.");
 }
}

/* ЧАТ */

document.getElementById("chatInput").addEventListener("keydown",e=>{
 if(e.key==="Enter"){
  const input=e.target;
  const value=input.value.trim();

  if(value){
   say(player.name+": "+value);
   input.value="";
  }
 }
});

/* ОКНА МЕНЮ */

function openModal(title,html){
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalContent").innerHTML=html;
 document.getElementById("modal").style.display="flex";
}

function closeModal(){
 document.getElementById("modal").style.display="none";
}

function showCommands(){
 openModal("⌨ КОМАНДЫ",`
  <p>/help — помощь</p>
  <p>/money — деньги</p>
  <p>/work — работа</p>
  <p>/home — домой</p>
  <p>/dance — танец</p>
  <p>/hello — привет</p>
  <p>/bots — жители</p>
  <p>/family — семья</p>
  <p>/car — машина</p>
  <input id="commandInput" placeholder="Напиши команду">
  <button onclick="runCommand()">Выполнить</button>
 `);
}

function runCommand(){
 const input=document.getElementById("commandInput");
 if(!input)return;

 const command=input.value.toLowerCase().trim();
 closeModal();

 switch(command){
  case "/help":showCommands();break;
  case "/money":say("Твои деньги: "+player.money);break;
  case "/work":work();break;
  case "/home":goHome();break;
  case "/dance":dance();break;
  case "/hello":hello();break;
  case "/bots":showBots();break;
  case "/family":showFamily();break;
  case "/car":useCar();break;
  default:say("Неизвестная команда. Напиши /help");
 }
}

function showBots(){
 let html="<p>Жители города:</p>";

 for(const b of bots){
  html+="<p>🤖 "+b.name+" — "+b.job+"</p>";
 }

 openModal("🤖 БОТЫ",html);
}

function showFamily(){
 openModal("👨‍👩‍👧 СЕМЬЯ",`
  <p>Добро пожаловать в семейную жизнь!</p>
  <p>Можно общаться с жителями, посещать дом и заботиться о семье.</p>
  <button onclick="say('Ты проводишь время с семьёй!');closeModal()">
   Провести время вместе
  </button>
 `);
}

function showMap(){
 openModal("🗺 КАРТА ГОРОДА",`
  <p>🏠 Жилые дома</p>
  <p>🏥 Больница</p>
  <p>🏫 Школа</p>
  <p>🛒 Магазин</p>

/* ОДЕЖДА */

function changeClothes(){
 const colors=[
  "#9855ee","#267bea","#df4e5b",
  "#239c65","#e69b32","#eeeeee",
  "#222222","#e4a6c4"
 ];

 let index=colors.indexOf(player.clothes);
 player.clothes=colors[(index+1)%colors.length];

 say("Одежда изменена!");
 saveGame();
}

/* СОХРАНЕНИЕ */

function saveGame(){
 try{
  localStorage.setItem("liveFamilySave",JSON.stringify({
   name:player.name,
   money:player.money,
   job:player.job,
   clothes:player.clothes,
   skin:player.skin
  }));
 }catch(e){}
}

/* ЗАПУСК */

document.addEventListener("visibilitychange",()=>{
 if(document.hidden){
  saveGame();
 }
});

window.addEventListener("beforeunload",saveGame);
