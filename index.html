<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIVE FAMILY — Кайсар</title>
<style>
:root{--bg:#090b19;--panel:#0d1023;--purple:#792cff;--pink:#e879ff;--edge:#d9c8ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#72c5ed;color:#fff;font-family:system-ui,Arial,sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:#79c9ed}
#world{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.panel{background:rgba(7,9,23,.97);border:3px solid var(--edge);box-shadow:0 0 0 2px #34215f,0 5px 0 #050611;border-radius:14px}
#hud{position:absolute;top:8px;left:8px;padding:7px 9px;display:flex;gap:8px;align-items:center;min-width:200px}
.avatar{width:49px;height:53px;border:2px solid #a66cff;border-radius:9px;background:linear-gradient(#422078,#17132d);display:grid;place-items:center;font-size:30px;flex-shrink:0}
#hud b{font-size:15px}#hud .meta{font-size:12px;color:#e5ddff}#cash{color:#ffe16a;font-weight:900}
#map{position:absolute;right:8px;top:8px;width:112px;padding:5px;text-align:center;font-weight:900;font-size:12px}
#mini{width:100%;height:70px;display:block;margin-top:3px;border:2px solid #8061bd;border-radius:6px}
#menu{position:absolute;left:8px;top:94px;width:132px;padding:5px}
.menuBtn{width:100%;border:1px solid #342858;border-radius:8px;background:#15172d;color:#fff;text-align:left;padding:7px 5px;margin:2px 0;font-size:12px}
.menuBtn.active{background:linear-gradient(100deg,#4d1ba8,#8739e8);border:2px solid #cbaaff}
#chatPanel{position:absolute;right:8px;top:94px;width:min(230px,42vw);max-height:48%;padding:7px;display:flex;flex-direction:column;gap:6px}
#chatHead{display:flex;justify-content:space-between;align-items:center;color:#e9d5ff;font-weight:900;border-bottom:1px solid #6b48a2;padding:1px 2px 6px}
#chatClose{background:#6825c9;border:1px solid #d2b4ff;color:white;border-radius:7px;font-size:17px;width:27px;height:27px}
#messages{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:70px;max-height:210px;overscroll-behavior:contain}
.msg{display:flex;gap:6px;align-items:flex-start;font-size:11px}
.msg .face{font-size:23px;width:27px;flex-shrink:0}
.msg .bubble{background:#251444;border:1px solid #9250e8;border-radius:10px;padding:5px 7px;line-height:1.3;max-width:100%;overflow-wrap:anywhere}
.msg .who{color:#e9baff;font-weight:800;margin-bottom:2px}
#chatForm{display:flex;gap:5px}
#chatInput{min-width:0;flex:1;background:#111329;border:1px solid #7f5bb2;border-radius:8px;padding:8px;color:white;font-size:12px;outline:none}
#send{width:34px;border:1px solid #d0b0ff;background:#7429d4;color:white;border-radius:8px;font-size:18px}
#dialog{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:min(570px,calc(100% - 16px));padding:9px 11px;display:flex;gap:9px;align-items:center;min-height:77px}
#portrait{font-size:40px;width:48px;text-align:center;flex-shrink:0}
#dialogName{font-weight:900;color:#e5baff;font-size:14px}#dialogText{font-size:12px;line-height:1.35}
#controls{position:absolute;left:12px;bottom:105px;display:grid;grid-template-columns:39px 39px 39px;grid-template-rows:39px 39px 39px;gap:3px}
.ctrl{background:#213750;border:2px solid #abc8eb;border-radius:10px;color:white;font-size:18px;touch-action:none}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:3}#right{grid-column:3;grid-row:2}
#actionButtons{position:absolute;right:10px;bottom:112px;display:flex;gap:7px}
.action{border:2px solid #c7a5ff;background:#6322bc;color:white;border-radius:50%;width:65px;height:65px;font-size:11px;font-weight:900}
#toast{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);background:#111326;border:2px solid #c7a5ff;border-radius:10px;padding:8px 12px;opacity:0;pointer-events:none;font-size:13px;font-weight:800;transition:opacity .2s}
#toast.show{opacity:1}
#modal{position:absolute;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}.modalBox{width:min(390px,100%);max-height:80%;overflow:auto;padding:15px;background:#0c0d20;border:3px solid #c4a4ff;border-radius:14px;box-shadow:0 0 0 3px #3c246e}
.modalBox h2{margin:0 0 10px;color:#e6c5ff;font-size:20px}.modalBox p{line-height:1.45;font-size:14px}
.close,.buy{padding:9px 14px;border:2px solid #c8a8ff;border-radius:9px;background:#632bb6;color:white;font-weight:800}
.skinGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.skin{padding:7px 2px;border:2px solid #51436f;background:#17182d;color:white;border-radius:8px;font-size:24px}.skin.selected{border-color:#f08af0;background:#3a235d}
@media(max-width:500px){#hud{min-width:174px}.avatar{width:43px;height:47px;font-size:26px}#map{width:96px}#menu{top:88px;width:119px}.menuBtn{font-size:11px;padding:7px 4px}#chatPanel{top:88px;width:42vw;max-height:43%;padding:5px}#messages{max-height:145px}.msg{font-size:10px}.msg .face{font-size:19px;width:22px}#chatInput{font-size:10px;padding:6px}#controls{bottom:103px;transform:scale(.9);transform-origin:left bottom}#actionButtons{bottom:112px;gap:4px}.action{width:56px;height:56px;font-size:10px}#dialog{bottom:6px;min-height:70px}#dialogText{font-size:11px}}
</style>
</head>
<body>
<div id="game">
<canvas id="world"></canvas>
<div id="hud" class="panel"><div class="avatar" id="hudFace">🧑🏻</div><div><b>LIVE FAMILY</b><div><span id="playerName">Кайсар ♡</span> · Ур. 1</div><div class="meta">XP <span id="xp">0</span>/100</div><div id="cash">🪙 1 000 ₽</div></div></div>
<div id="map" class="panel">КАРТА<canvas id="mini"></canvas><div class="meta" id="areaLabel">Центр города</div></div>
<nav id="menu" class="panel">
<button class="menuBtn active" data-open="home">⌂ Дом</button><button class="menuBtn" data-open="shop">🛒 Магазин</button><button class="menuBtn" data-open="skins">👕 Скин</button><button class="menuBtn" data-open="work">💼 Работа</button><button class="menuBtn" data-open="family">♡ Семья</button><button class="menuBtn" data-open="inventory">🎒 Инвентарь</button><button class="menuBtn" data-open="secrets">✦ Секреты</button><button class="menuBtn" data-open="chat">💬 Чат</button><button class="menuBtn" data-open="map">⌖ Карта</button>
</nav>
<section id="chatPanel" class="panel">
<div id="chatHead"><span>💬 Чат LIVE FAMILY</span><button id="chatClose" aria-label="Свернуть чат">×</button></div>
<div id="messages"></div>
<form id="chatForm"><input id="chatInput" maxlength="160" autocomplete="off" placeholder="Написать сообщение..."><button id="send" type="submit">➤</button></form>
</section>
<div id="controls"><button class="ctrl" id="up">▲</button><button class="ctrl" id="left">◀</button><button class="ctrl" id="down">▼</button><button class="ctrl" id="right">▶</button></div>
<div id="actionButtons"><button class="action" id="run">БЕГ</button><button class="action" id="act">ДЕЙСТВИЕ</button></div>
<div id="dialog" class="panel"><div id="portrait">🧑🏻</div><div><div id="dialogName">Кайсар</div><div id="dialogText">Добро пожаловать в LIVE FAMILY! Исследуй город и общайся с жителями.</div></div></div>
<div id="toast"></div><div id="modal"><div class="modalBox" id="modalContent"></div></div>
</div>
<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d'),mini=document.getElementById('mini'),mctx=mini.getContext('2d');
let vw=innerWidth,vh=innerHeight,dpr=devicePixelRatio||1,px=vw*1.5,py=vh*1.5,camX=0,camY=0,face='🧑🏻',cash=Number(localStorage.getItem('lf_cash')||1000),xp=0,skin=0,running=false,chatOpen=true;
const areaNames=[['Северный парк','Старый квартал','Восточный район'],['Западный парк','Центр города','Торговая улица'],['Южный парк','Жилой район','Набережная']];
const skins=[['🧑🏻','Обычный',0],['👩🏻','Горожанка',250],['🧑🏽','Путешественник',350],['🧑🏻‍🦱','Кудрявый',500],['🧑🏻‍🎤','Музыкант',650],['🧝🏻','Фэнтези',800],['🧑🏿','Новый стиль',450],['👩🏽‍🦰','Рыжая',550]];
const npcBase=[['Аня','Привет! Хороший сегодня день.','👩🏻'],['Дима','Я работаю неподалёку. Загляни в офис!','🧑🏻'],['Вика','Привет, Кайсар! Рада тебя видеть. ♡','👩🏽']];
let npcs=[],chatHistory=JSON.parse(localStorage.getItem('lf_chat')||'[]');
function resize(){vw=innerWidth;vh=innerHeight;canvas.width=vw*dpr;canvas.height=vh*dpr;canvas.style.width=vw+'px';canvas.style.height=vh+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function tree(x,y,s=1){rect(x-6*s,y+13*s,12*s,25*s,'#79502e');rect(x-22*s,y-8*s,44*s,30*s,'#16884b');rect(x-16*s,y-22*s,33*s,22*s,'#27a957');rect(x-8*s,y-31*s,18*s,16*s,'#45bd66')}
function house(x,y,w,h,color,label){rect(x+4,y+h-7,w,h*.1,'#725047');rect(x,y,w,h,color);rect(x-6,y-10,w+12,13,'#513b4b');rect(x+w*.42,y+h*.62,w*.18,h*.38,'#604337');for(let i=0;i<3;i++){let wx=x+w*(.12+i*.34);rect(wx,y+h*.25,w*.17,h*.22,'#75d8ef');rect(wx+w*.075,y+h*.25,w*.02,h*.22,'#e6fbff')}ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 14px system-ui';ctx.fillText(label,x+w/2,y-16)}
function sector(sx,sy){let ox=sx*vw-camX,oy=sy*vh-camY;rect(ox,oy,vw,vh,'#79c9ed');rect(ox,oy+vh*.69,vw,vh*.31,'#69b94e');
for(let i=0;i<75;i++){let x=ox+(i*83+17)%vw,y=oy+vh*.70+(i*31)%(vh*.29);rect(x,y,3,3,i%2?'#9bdc69':'#4a9a3f')}
rect(ox,oy+vh*.39,vw,vh*.24,'#aa9cba');rect(ox,oy+vh*.405,vw,vh*.012,'#887c9c');
for(let x=0;x<vw;x+=40)for(let y=vh*.42;y<vh*.62;y+=28)rect(ox+x,oy+y,35,2,'#8e829f');
if((sx+sy)%2===0){house(ox+vw*.06,oy+vh*.22,vw*.22,vh*.24,'#d99a68','ДОМ');house(ox+vw*.39,oy+vh*.18,vw*.21,vh*.27,'#d95787','МАГАЗИН');house(ox+vw*.70,oy+vh*.21,vw*.20,vh*.24,'#586d9e','РАБОТА')}
else{house(ox+vw*.10,oy+vh*.20,vw*.22,vh*.25,'#d9ae70','КАФЕ');house(ox+vw*.64,oy+vh*.19,vw*.23,vh*.26,'#9b83c7','КВАРТИРЫ')}
for(let i=0;i<12;i++){let x=ox+(i*137+65)%vw,y=oy+vh*.68+(i%3)*42;tree(x,y,.8+(i%2)*.2)}
for(let i=0;i<10;i++){let x=ox+(i*91+30)%vw,y=oy+vh*.73+(i%4)*35;rect(x,y,4,4,'#ff8fc7');rect(x+4,y+3,4,4,'#fff2a4')}
rect(ox+vw*.18,oy+vh*.78,62,9,'#8a552e');rect(ox+vw*.18,oy+vh*.76,62,7,'#c38a45');
}
function makeNpcs(){npcs=[];for(let sy=0;sy<3;sy++)for(let sx=0;sx<3;sx++)npcBase.forEach((n,i)=>npcs.push({x:sx*vw+vw*(.28+i*.22),y:sy*vh+vh*(.55+(i%2)*.07),name:n[0],line:n[1],emoji:n[2]}))}
makeNpcs();
function drawMini(){let w=mini.clientWidth,h=mini.clientHeight;mini.width=w*dpr;mini.height=h*dpr;mctx.setTransform(dpr,0,0,dpr,0,0);mctx.fillStyle='#5aa95c';mctx.fillRect(0,0,w,h);mctx.fillStyle='#aa9cba';mctx.fillRect(0,h*.31,w,h*.35);mctx.fillRect(w*.31,0,w*.35,h);for(let y=0;y<3;y++)for(let x=0;x<3;x++){mctx.fillStyle=(x+y)%2?'#4b9e58':'#70bd63';mctx.fillRect(x*w/3+2,y*h/3+2,w/3-4,h/3-4)}mctx.fillStyle='#f3d99c';[[.16,.17],[.5,.17],[.83,.17],[.16,.83],[.83,.83]].forEach(p=>mctx.fillRect(p[0]*w-5,p[1]*h-5,10,10));mctx.fillStyle='white';mctx.beginPath();mctx.arc(px/(vw*3)*w,py/(vh*3)*h,4,0,Math.PI*2);mctx.fill()}
let lastArea='';
function draw(){ctx.clearRect(0,0,vw,vh);camX=Math.max(0,Math.min(vw*2,px-vw/2));camY=Math.max(0,Math.min(vh*2,py-vh/2));for(let y=0;y<3;y++)for(let x=0;x<3;x++)sector(x,y);
npcs.forEach(n=>{let x=n.x-camX,y=n.y-camY;if(x>-30&&x<vw+30&&y>-30&&y<vh+30){ctx.textAlign='center';ctx.font='26px system-ui';ctx.fillText(n.emoji,x,y);ctx.font='bold 10px system-ui';ctx.fillStyle='#fff';ctx.fillText(n.name,x,y+13)}});
let x=px-camX,y=py-camY;ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.fillStyle='#111';ctx.fillText('Кайсар ♡',x,y-27);ctx.font='30px system-ui';ctx.fillText(face,x,y+2);
let ax=Math.min(2,Math.floor(px/vw)),ay=Math.min(2,Math.floor(py/vh)),name=areaNames[ay][ax];document.getElementById('areaLabel').textContent=name;if(name!==lastArea){lastArea=name;toast('Район: '+name)}drawMini();requestAnimationFrame(draw)}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove('show'),1200)}
function move(dx,dy){let ox=Math.floor(px/vw),oy=Math.floor(py/vh);px=Math.max(12,Math.min(vw*3-12,px+dx));py=Math.max(65,Math.min(vh*3-80,py+dy));if(Math.floor(px/vw)!==ox||Math.floor(py/vh)!==oy)toast('Переход в новый район')}
function say(n,t,e='🧑🏻'){document.getElementById('dialogName').textContent=n;document.getElementById('dialogText').textContent=t;document.getElementById('portrait').textContent=e}
function updateHud(){document.getElementById('cash').textContent='🪙 '+cash.toLocaleString('ru-RU')+' ₽';document.getElementById('xp').textContent=xp;document.getElementById('hudFace').textContent=face;localStorage.setItem('lf_cash',cash)}
function modal(title,body){document.getElementById('modalContent').innerHTML=`<h2>${title}</h2>${body}<p style="text-align:right"><button class="close" id="closeModal">Закрыть</button></p>`;document.getElementById('modal').classList.add('show');document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('show')}
function open(which){document.querySelectorAll('.menuBtn').forEach(b=>b.classList.toggle('active',b.dataset.open===which));
if(which==='chat'){document.getElementById('chatPanel').style.display='flex';chatOpen=true;document.getElementById('chatInput').focus()}
else if(which==='secrets'){modal('✦ Секреты ✦',`<p>Особенное послание от Кайсара:</p><p style="color:#f18be8;text-align:center;font-weight:800">Я тебя люблю, Вика!<br>Ты моя будущая жена.<br>Я тебя никогда не брошу. ♡</p>`)}
else if(which==='skins'){modal('👕 Магазин скинов',`<div class="skinGrid">${skins.map((s,i)=>`<button class="skin ${i===skin?'selected':''}" data-skin="${i}">${s[0]}</button>`).join('')}</div><p id="skinInfo">${skins[skin][1]} · ${skins[skin][2]} ₽</p><button class="buy" id="buySkin">Купить / надеть</button>`);document.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{skin=+b.dataset.skin;document.querySelectorAll('[data-skin]').forEach(x=>x.classList.toggle('selected',+x.dataset.skin===skin));document.getElementById('skinInfo').textContent=skins[skin][1]+' · '+skins[skin][2]+' ₽'});document.getElementById('buySkin').onclick=()=>{let p=skins[skin][2];if(cash>=p){cash-=p;face=skins[skin][0];updateHud();say('Кайсар','Новый образ надет!',face);document.getElementById('modal').classList.remove('show')}else document.getElementById('skinInfo').textContent='Не хватает денег.'}}
else if(which==='shop')modal('🛒 Магазин',`<p>Здесь можно покупать одежду и предметы. Новые товары появятся позже.</p>`);
else if(which==='work')modal('💼 Работа',`<p>Подойди к зданию работы и нажми «ДЕЙСТВИЕ», чтобы получить 100 ₽.</p>`);
else if(which==='family')modal('♡ Семья',`<p>Знакомься с жителями, разговаривай и проводи время вместе.</p>`);
else if(which==='inventory')modal('🎒 Инвентарь',`<p>Пока пусто. Купленные скины доступны в меню персонажа.</p>`);
else if(which==='map')modal('⌖ Карта города',`<p>В городе 9 районов. Иди к краю экрана, чтобы перейти на соседнюю карту.</p>`);
else say('Кайсар','Это твой дом. Исследуй город и общайся с жителями.',face)}
document.querySelectorAll('.menuBtn').forEach(b=>b.onclick=()=>open(b.dataset.open));
function renderChat(){let box=document.getElementById('messages');box.innerHTML='';chatHistory.slice(-30).forEach(m=>{let row=document.createElement('div');row.className='msg';let f=document.createElement('div');f.className='face';f.textContent=m.face;let content=document.createElement('div');let who=document.createElement('div');who.className='who';who.textContent=m.name+' · '+m.time;let bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;content.append(who,bubble);row.append(f,content);box.append(row)});box.scrollTop=box.scrollHeight}
function saveChat(){localStorage.setItem('lf_chat',JSON.stringify(chatHistory.slice(-60)))}
function addMessage(name,text,emoji){let now=new Date(),time=now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});chatHistory.push({name,text,face:emoji,time});saveChat();renderChat()}
if(chatHistory.length===0){chatHistory=[{name:'Вика ♡',text:'Привет, Кайсар! ♡',face:'👩🏽',time:'13:07'},{name:'Кайсар',text:'Привет, Вика! ♡',face:'🧑🏻',time:'13:08'},{name:'Вика ♡',text:'Рада тебя видеть!',face:'👩🏽',time:'13:09'}];saveChat()}
renderChat();
document.getElementById('chatForm').addEventListener('submit',e=>{e.preventDefault();let input=document.getElementById('chatInput'),t=input.value.trim();if(!t)return;addMessage('Кайсар',t,face);input.value='';});
document.getElementById('chatClose').onclick=()=>{document.getElementById('chatPanel').style.display='none';chatOpen=false};
let moveTimer=null;function startMove(dx,dy){move(dx,dy);clearInterval(moveTimer);moveTimer=setInterval(()=>move(dx,dy),65)}function stopMove(){clearInterval(moveTimer);moveTimer=null}
[['up',0,-7],['down',0,7],['left',-7,0],['right',7,0]].forEach(([id,dx,dy])=>{let b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);startMove(dx*(running?1.7:1),dy*(running?1.7:1))});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,stopMove))});
document.getElementById('run').onclick=()=>{running=!running;document.getElementById('run').textContent=running?'ИДЁШЬ':'БЕГ';toast(running?'Быстрое движение включено':'Обычная скорость')};
addEventListener('keydown',e=>{let k=e.key.toLowerCase(),v=running?16:9;if(k==='arrowup'||k==='w')move(0,-v);if(k==='arrowdown'||k==='s')move(0,v);if(k==='arrowleft'||k==='a')move(-v,0);if(k==='arrowright'||k==='d')move(v,0)});
document.getElementById('act').onclick=()=>{let n=npcs.find(n=>Math.hypot(n.x-px,n.y-py)<90);if(n){say(n.name,n.name==='Вика'?'Привет, Кайсар! Загляни в секреты. ♡':n.line,n.emoji);addMessage(n.name,n.line,n.emoji);return}let rx=(px%vw)/vw,ry=(py%vh)/vh;if(ry<.5&&rx>.35&&rx<.65){open('shop')}else if(ry<.5&&rx>.65){cash+=100;xp+=10;updateHud();say('Работа','Ты получил зарплату: 100 ₽!','💼')}else say('Кайсар','Исследуй '+areaNames[Math.min(2,Math.floor(py/vh))][Math.min(2,Math.floor(px/vw))]+' и ищи жителей.',face)};
updateHud();requestAnimationFrame(draw);
})();
</script>
</div></body></html>
