<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LIVE FAMILY</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body { margin: 0; overflow: hidden; background: #14361d; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  canvas#game { width: 100vw; height: 100dvh; display: block; image-rendering: pixelated; }

  .panel {
    position: fixed;
    z-index: 5;
    background: rgba(18, 12, 36, 0.92);
    border: 2.5px solid #9d72ff;
    border-radius: 14px;
    box-shadow: 0 0 12px rgba(141, 83, 255, 0.65), inset 0 0 8px rgba(157, 114, 255, 0.25);
    backdrop-filter: blur(4px);
  }

  #profile {
    top: 10px;
    left: 10px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 225px;
  }
  #avatarBox {
    width: 54px;
    height: 54px;
    border-radius: 10px;
    border: 2px solid #b491ff;
    background: #271a4a;
    overflow: hidden;
    flex-shrink: 0;
  }
  .prof-info { font-size: 13px; line-height: 1.35; }
  .prof-title { font-weight: 800; font-size: 14px; color: #fff; letter-spacing: 0.5px; }
  .xp-bar {
    width: 110px;
    height: 12px;
    background: #291c4d;
    border: 1px solid #8a64e8;
    border-radius: 6px;
    position: relative;
    margin: 3px 0;
    overflow: hidden;
  }
  .xp-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #8b5cf6, #ec4899); }
  .xp-text { position: absolute; inset: 0; font-size: 9px; text-align: center; line-height: 11px; font-weight: bold; }

  #menu {
    top: 92px;
    left: 10px;
    padding: 7px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 138px;
  }
  .menu-btn {
    background: linear-gradient(180deg, #321d6b 0%, #21124a 100%);
    color: #fff;
    border: 1.5px solid #8b63eb;
    border-radius: 9px;
    padding: 7px 10px;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: transform 0.1s, background 0.15s;
  }
  .menu-btn:active { transform: scale(0.96); background: #4c2ba3; }
  .menu-btn.active { border-color: #f472b6; box-shadow: 0 0 8px rgba(244, 114, 182, 0.5); }

  #miniWrap {
    top: 10px;
    right: 10px;
    padding: 4px;
    text-align: center;
  }
  #miniTitle { font-size: 11px; font-weight: bold; margin-bottom: 2px; color: #e2d4ff; }
  #mini { width: 118px; height: 96px; border-radius: 9px; display: block; border: 1.5px solid #7c52db; }

  #chat {
    right: 10px;
    top: 132px;
    width: 215px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    transition: height 0.2s;
  }
  #chat.minimized { height: 40px; overflow: hidden; }
  .chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: bold;
    font-size: 14px;
    padding-bottom: 5px;
    border-bottom: 1px solid rgba(157, 114, 255, 0.3);
  }
  .chat-toggle {
    background: #3a2278;
    border: 1px solid #9d72ff;
    color: #fff;
    border-radius: 6px;
    width: 22px;
    height: 22px;
    cursor: pointer;
    font-size: 12px;
    line-height: 18px;
    padding: 0;
  }
  #messages {
    height: 145px;
    overflow-y: auto;
    margin: 6px 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-right: 2px;
  }
  .msg-item { font-size: 11.5px; }
  .msg-meta { color: #d8b4fe; font-weight: bold; font-size: 10.5px; margin-bottom: 2px; }
  .msg-meta span { color: #9ca3af; font-weight: normal; font-size: 9.5px; margin-left: 4px; }
  .msg-bubble {
    background: rgba(59, 35, 117, 0.85);
    border: 1px solid #8b63eb;
    border-radius: 8px;
    padding: 4px 8px;
    display: inline-block;
    max-width: 100%;
    word-wrap: break-word;
  }
  .chat-input-row { display: flex; gap: 5px; }
  #msg {
    flex: 1;
    background: #1a1033;
    border: 1.5px solid #7c52db;
    border-radius: 8px;
    color: #fff;
    padding: 6px 8px;
    font-size: 12px;
    outline: none;
    user-select: text;
    -webkit-user-select: text;
  }
  #sendBtn {
    background: #7c3aed;
    border: 1.5px solid #c4b5fd;
    color: #fff;
    border-radius: 8px;
    width: 32px;
    cursor: pointer;
    font-weight: bold;
  }

  #bottomCards {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    max-width: calc(100vw - 320px);
  }
  .bottom-card {
    background: rgba(18, 12, 36, 0.94);
    border: 2px solid #9d72ff;
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.35;
    box-shadow: 0 0 12px rgba(141, 83, 255, 0.5);
  }
  .card-header { font-weight: bold; color: #e9d5ff; margin-bottom: 3px; display: flex; align-items: center; gap: 5px; }
  #secretCard { border-color: #c084fc; box-shadow: 0 0 15px rgba(192, 132, 252, 0.65); text-align: center; }
  #secretCard .card-header { justify-content: center; color: #f5d0fe; }

  #controls {
    position: fixed;
    bottom: 14px;
    left: 14px;
    z-index: 6;
    display: grid;
    grid-template-columns: 44px 44px 44px;
    grid-template-rows: 44px 44px 44px;
    gap: 3px;
  }
  .dpad-btn {
    background: rgba(33, 20, 69, 0.9);
    border: 2px solid #9d72ff;
    border-radius: 10px;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  }
  .dpad-btn:active { background: #6d28d9; transform: scale(0.94); }

  #actions {
    position: fixed;
    bottom: 16px;
    right: 14px;
    z-index: 6;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .circle-btn {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #3b227a, #1d103d);
    border: 2.5px solid #a78bfa;
    color: #fff;
    font-size: 11px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(139, 92, 246, 0.6);
  }
  .circle-btn:active { transform: scale(0.92); background: #5b21b6; }
  .circle-btn span.icon { font-size: 20px; }

  #modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(8, 5, 18, 0.78);
    align-items: center;
    justify-content: center;
    padding: 15px;
  }
  .modal-box {
    background: #1c1238;
    border: 2.5px solid #a78bfa;
    border-radius: 16px;
    padding: 18px;
    width: 100%;
    max-width: 340px;
    box-shadow: 0 0 25px rgba(139, 92, 246, 0.7);
  }
  .modal-box h3 { margin: 0 0 12px; color: #f3e8ff; border-bottom: 1px solid #4c2ba3; padding-bottom: 8px; }
  .shop-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #281952;
    padding: 8px 10px;
    border-radius: 10px;
    margin-bottom: 8px;
    border: 1px solid #6d4aff;
  }
  .action-small {
    background: #7c3aed;
    color: #fff;
    border: 1px solid #c4b5fd;
    border-radius: 7px;
    padding: 6px 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .close-btn {
    width: 100%;
    margin-top: 10px;
    padding: 9px;
    background: #3b227a;
    color: #fff;
    border: 1.5px solid #9d72ff;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
  }

  @media (max-width: 760px) {
    #bottomCards { flex-direction: column; bottom: 155px; width: 220px; max-width: 60vw; }
    #chat { width: 165px; top: 120px; }
    #messages { height: 105px; }
    #menu { width: 122px; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="profile" class="panel">
  <canvas id="avatarBox" width="54" height="54"></canvas>
  <div class="prof-info">
    <div class="prof-title">👑 LIVE FAMILY</div>
    <div><span id="nick">Кайсар</span> 💜</div>
    <div style="display:flex;align-items:center;gap:6px;">
      <span>Ур. <b id="lvl">1</b></span>
      <div class="xp-bar"><div class="xp-fill" id="xpFill"></div><div class="xp-text" id="xpText">0 / 100 XP</div></div>
    </div>
    <div>🪙 <b id="money">1 000</b> ₽</div>
  </div>
</div>

<div id="menu" class="panel">
  <button class="menu-btn" onclick="openMenu('Дом')">🏠 Дом</button>
  <button class="menu-btn" onclick="openMenu('Магазин')">🛒 Магазин</button>
  <button class="menu-btn" onclick="openMenu('Скин')">👕 Скин</button>
  <button class="menu-btn" onclick="openMenu('Работа')">💼 Работа</button>
  <button class="menu-btn" onclick="openMenu('Семья')">❤️ Семья</button>
  <button class="menu-btn" onclick="openMenu('Инвентарь')">🎁 Инвентарь</button>
  <button class="menu-btn active" onclick="toggleSecret()">⭐ Секреты</button>
  <button class="menu-btn" onclick="openMenu('Карта')">📍 Карта</button>
</div>

<div id="miniWrap" class="panel">
  <div id="miniTitle">Карта</div>
  <canvas id="mini" width="118" height="96"></canvas>
</div>

<div id="chat" class="panel">
  <div class="chat-header">
    <span>💬 Чат</span>
    <button class="chat-toggle" onclick="toggleChat()">✕</button>
  </div>
  <div id="messages">
    <div class="msg-item">
      <div class="msg-meta">Вика 💜 <span>13:07</span></div>
      <div class="msg-bubble">Привет, Кайсар! 💜</div>
    </div>
    <div class="msg-item">
      <div class="msg-meta">Кайсар 🖤 <span>13:08</span></div>
      <div class="msg-bubble">Привет, Вика! 💜</div>
    </div>
    <div class="msg-item">
      <div class="msg-meta">Вика 💜 <span>13:09</span></div>
      <div class="msg-bubble">Ты мне нравишься... 💜</div>
    </div>
    <div class="msg-item">
      <div class="msg-meta">Кайсар 🖤 <span>13:10</span></div>
      <div class="msg-bubble">Я тебя люблю, Вика! 💜</div>
    </div>
  </div>
  <div class="chat-input-row">
